        body { font-family: 'Inter', sans-serif; }
        
        /* Cấu hình khi in PDF */
        @media print {
            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .print-hidden, .preview-toolbar, .no-print {

            /* Xóa hiệu ứng bóng đổ và bo góc khi in */
            .print-no-shadow { box-shadow: none !important; border-radius: 0 !important; margin: 0 !important; }
            
            /* Ép thẻ input/textarea thành chữ tĩnh */
            textarea, input {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                overflow: hidden !important;
                outline: none !important;
                box-shadow: none !important;

            textarea::placeholder, input::placeholder { color: transparent !important; }

            .avoid-break { page-break-inside: avoid !important; }
            tr { page-break-inside: avoid !important; page-break-after: auto !important; }
            td, th { page-break-inside: avoid !important; }
            .page-break-before { page-break-before: always !important; }
            
            /* Loại bỏ khoảng trắng dư thừa do min-height gây ra */
            .print-container { min-height: 0 !important; height: auto !important; padding: 0 !important;}

    <script type="text/babel">
        const { useState, useRef, useMemo, useEffect, Fragment } = React;

        const EditableInput = ({ value, onChange, placeholder = "", className = "", isTextArea = false, isEditing = true }) => {
            if (!isEditing) {
                if (!value) return null;
                return <div className={`whitespace-pre-wrap ${className}`}>{value}</div>;
            }
            
            return isTextArea ? (
                <textarea
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 resize-none print-hidden outline-none ${className}`}
                    rows={1}
                    onInput={(e) => {
                        e.target.style.height = 'auto';
                        e.target.style.height = e.target.scrollHeight + 'px';
                    }}
                />
            ) : (
                <input
                    type="text"
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 print-hidden outline-none ${className}`}
                />
            );
        };

        const ImageUpload = ({ value, onChange, isEditing = true }) => {
            const fileInputRef = useRef(null);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => onChange(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center w-full h-full min-h-[60px]">
                    {value ? (
                        <div className="relative group w-full h-full flex items-center justify-center">
                            <img src={value} alt="Uploaded" className="max-w-full max-h-[80px] object-contain" />
                            {isEditing && (
                                <button 
                                    onClick={() => onChange('')} 
                                    className="absolute top-0 right-0 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity print-hidden no-print"
                                    title="Xóa ảnh"
                                >
                                    <i data-lucide="x" class="w-3 h-3"></i>
                                </button>
                            )}
                        </div>
                    ) : (
                        isEditing && (
                            <div 
                                onClick={() => fileInputRef.current?.click()}
                                className="cursor-pointer flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 print-hidden no-print border-2 border-dashed border-gray-300 rounded p-1 w-full h-full"
                            >
                                <i data-lucide="image" class="w-5 h-5"></i>
                                <span className="text-[10px] mt-1 text-center">Tải ảnh</span>
                            </div>
                        )
                    )}
                    <input 
                        type="file" 
                        accept="image/*" 
                        ref={fileInputRef} 
                        onChange={handleFileChange} 
                        className="hidden" 
                    />
                </div>
            );
        };

                    const totalQty = bomMap.floors.reduce((qSum, f) => qSum + (parseFloat(item.quantities[f.id]) || 0), 0);
                    return sum + (totalQty * (parseFloat(item.price) || 0));
                }, 0);
            }, [bomMap]);

            const implementationCosts = useMemo(() => {
                return {
                    design: hardwareTotal * 0.12,
                    install: hardwareTotal * 0.13
                };
            }, [hardwareTotal]);

            const ioCalculations = useMemo(() => {
                const calc = { floors: {}, total: { input: 0, dinNeed: 0, dinReported: 0, missing: 0 } };
                bomMap.floors.forEach(f => { calc.floors[f.id] = { input: 0, dinReported: 0, dinNeed: 0, missing: 0 }; });

                bomMap.items.forEach(item => {
                    // Nhóm Input: Cảm biến (gắn trần, cầu thang, cửa từ) + Công tắc cơ
                    const isInputDevice = item.isInput || (item.name && item.name.toLowerCase().includes('cảm biến'));
                    const isMechanical = item.isMechanical;
                    const buttons = item.buttons || 1;
                    
                    // Nhóm Điều khiển: Rèm, Chiếu sáng (có cờ isDinController)
                    const isDinController = item.isDinController;

                    bomMap.floors.forEach(f => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        
                        if (isInputDevice) {
                            calc.floors[f.id].input += qty;
                            calc.total.input += qty;
                        } else if (isMechanical) {
                            const inputs = qty * buttons;
                            calc.floors[f.id].input += inputs;
                            calc.total.input += inputs;
                        }

                        if (isDinController) {
                            calc.floors[f.id].dinReported += qty;
                            calc.total.dinReported += qty;
                        }
                    });
                });

                bomMap.floors.forEach(f => {
                    calc.floors[f.id].dinNeed = Math.ceil(calc.floors[f.id].input / 8);
                    const diff = calc.floors[f.id].dinNeed - calc.floors[f.id].dinReported;
                    calc.floors[f.id].missing = diff > 0 ? diff : 0;
                });

                calc.total.dinNeed = Math.ceil(calc.total.input / 8);
                const totalDiff = calc.total.dinNeed - calc.total.dinReported;
                calc.total.missing = totalDiff > 0 ? totalDiff : 0;

                return calc;
            }, [bomMap]);

            const detailedData = useMemo(() => {
                let floorsData = [];
                
                bomMap.floors.forEach(f => {
                    let systemsMap = {};
                    
                    bomMap.items.forEach(item => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (qty > 0 && !item.isMechanical && !item.isImplementationCost) {
                            const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                            if (!isCommonSystem) {
                                const sysName = `${item.categoryName}`;
                                if (!systemsMap[sysName]) systemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                                systemsMap[sysName].items.push({ ...item, qty, total: qty * item.price });
                            }
                        }
                    });

                    if (Object.keys(systemsMap).length > 0) {
                        floorsData.push({ id: f.id, name: f.name, systems: Object.values(systemsMap) });
                    }
                });

                let commonSystemsMap = {};
                bomMap.items.forEach(item => {
                    const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                    if (isCommonSystem && !item.isMechanical && !item.isImplementationCost) {
                        const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                        if (totalQty > 0) {
                            const sysName = `${item.categoryName}`;
                            if (!commonSystemsMap[sysName]) commonSystemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                            commonSystemsMap[sysName].items.push({ ...item, qty: totalQty, total: totalQty * item.price });
                        }
                    }
                });

                if (Object.keys(commonSystemsMap).length > 0) {
                    floorsData.push({ id: 'common', name: 'HỆ THỐNG CHUNG', systems: Object.values(commonSystemsMap) });
                }

                return floorsData;
            }, [bomMap]);

            const handleExportData = () => {
                const dataToSave = { headerInfo, bomMap, audioData, commercialTerms, includeAudio, exchangeRate, currency };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `BaoGia_${headerInfo.owner.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.headerInfo) setHeaderInfo(parsed.headerInfo);
                        if (parsed.bomMap) setBomMap(parsed.bomMap);
                        if (parsed.audioData) setAudioData(parsed.audioData);
                        if (parsed.commercialTerms) setCommercialTerms(parsed.commercialTerms);
                        if (parsed.includeAudio !== undefined) setIncludeAudio(parsed.includeAudio);
                        if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
                        if (parsed.currency) setCurrency(parsed.currency);
                        setNotification("Mở file thành công!");
                        setTimeout(() => setNotification(''), 3000);
                    } catch (err) {
                        setNotification("File không hợp lệ hoặc bị lỗi định dạng!");
                        setTimeout(() => setNotification(''), 3000);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            const updateBOMQuantity = (floorId, itemId, newQtyStr) => {
                const qty = parseFloat(newQtyStr);
                const finalQty = isNaN(qty) ? '' : qty;
                setBomMap(prev => {
                    const newItems = prev.items.map(item => {
                        if (item.id === itemId) {
                            return { ...item, quantities: { ...item.quantities, [floorId]: finalQty } };
                        }
                        return item;
                    });
                    return { ...prev, items: newItems };
                });
            };

            const addFloor = () => {
                const newId = `t${bomMap.floors.length + 1}`;
                setBomMap(prev => {
                    let newFloors = [...prev.floors];
                    newFloors.push({ id: newId, name: `Tầng ${prev.floors.length + 1}` });
                    return { ...prev, floors: newFloors };
                });
            };

            const removeFloor = (floorId) => {
                setBomMap(prev => ({ ...prev, floors: prev.floors.filter(f => f.id !== floorId) }));
            };

            const deleteItemFromDetail = (floorId, itemId) => {
                updateBOMQuantity(floorId, itemId, 0); 
            };

            const renderBOM = () => {
                const groupedItems = bomMap.items.reduce((acc, item) => {
                    if (!acc[item.category]) acc[item.category] = { categoryName: item.categoryName, items: [] };
                    acc[item.category].items.push(item);
                    return acc;
                }, {});

                return (
                    <div className="w-full">
                        <h2 className="text-xl font-bold text-center mb-6 uppercase">BẢNG THỐNG KÊ KHỐI LƯỢNG THIẾT BỊ (BOM)</h2>
                        <div className="overflow-x-auto">

                                        <td className="border border-black p-2 text-center w-20">Đơn vị</td>
                                        {bomMap.floors.map(f => (

                                                    <button onClick={() => removeFloor(f.id)} className="absolute -top-2 -right-2 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded-full border shadow print-hidden">

                                                    </button>

                                    {Object.keys(groupedItems).map((catKey) => (

                                                <td className="border border-black p-2 uppercase" colSpan={bomMap.floors.length + 4}>{groupedItems[catKey].categoryName}</td>
                                            </tr>
                                            {groupedItems[catKey].items.map((item, idx) => {
                                                const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                                                let displayPrice = item.price;
                                                if (item.isImplementationCost) {
                                                    displayPrice = item.type === 'design' ? implementationCosts.design : implementationCosts.install;
                                                }

                                                return (
                                                    <tr key={item.id} className={item.isMechanical ? "text-gray-600 bg-gray-50" : ""}>
                                                        <td className="border border-black p-2 text-center">{idx + 1}</td>
                                                        <td className="border border-black p-2">
                                                            <EditableInput value={item.name} onChange={(v) => {
                                                                setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, name: v} : i)});
                                                            }} isEditing={!isPreview} />
                                                            {item.isMechanical && <span className="text-[10px] text-red-500 ml-2">(Chỉ tính IO)</span>}
                                                        </td>
                                                        <td className="border border-black p-2 text-center">{item.unit}</td>
                                                        
                                                        {item.isImplementationCost ? (
                                                            <td colSpan={bomMap.floors.length + 1} className="border border-black p-2 text-center text-gray-400 bg-gray-50">- (Tự động tính) -</td>
                                                        ) : (
                                                            <>
                                                                {bomMap.floors.map(f => (
                                                                    <td key={f.id} className="border border-black p-1 text-center">
                                                                        <input 
                                                                            type="number" 
                                                                            value={item.quantities[f.id] === 0 ? '' : (item.quantities[f.id] || '')}
                                                                            onChange={(e) => updateBOMQuantity(f.id, item.id, e.target.value)}
                                                                            className="w-full text-center border-none focus:ring-1 focus:ring-blue-500 bg-transparent print-hidden outline-none"
                                                                            style={{ display: isPreview ? 'none' : 'block' }}
                                                                        />
                                                                        {isPreview && <div className="text-center">{item.quantities[f.id] || ''}</div>}
                                                                    </td>
                                                                ))}
                                                                <td className="border border-black p-2 text-center font-bold bg-gray-50">{totalQty > 0 ? totalQty : ''}</td>
                                                            </>
                                                        )}
                                                        <td className="border border-black p-2 text-center">
                                                            {item.isImplementationCost ? '-' : (
                                                                isPreview ? (
                                                                    <div className="text-center">{formatMoney(item.price)}</div>
                                                                ) : (
                                                                    <EditableInput 
                                                                        value={item.price} 
                                                                        onChange={(v) => {
                                                                            setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, price: v} : i)});
                                                                        }} 
                                                                        className="text-center" 
                                                                        isEditing={true} 
                                                                    />
                                                                )
                                                            )}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </React.Fragment>
                                    ))}

                                    <tr className="bg-[#e2efda] font-bold mt-4">
                                        <td className="border border-black p-2 text-center">IX</td>
                                        <td className="border border-black p-2 uppercase" colSpan={bomMap.floors.length + 4}>TÍNH TOÁN ĐẦU VÀO IO</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center">1</td>
                                        <td className="border border-black p-2">Tổng số đầu vào Input</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center font-bold bg-orange-50">{ioCalculations.floors[f.id].input || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold bg-orange-50">{ioCalculations.total.input || ''}</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center">2</td>
                                        <td className="border border-black p-2">Số bộ DIN8s-8i CẦN (Làm tròn lên)</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center">{ioCalculations.floors[f.id].dinNeed || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold">{ioCalculations.total.dinNeed || ''}</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center">3</td>
                                        <td className="border border-black p-2">Tổng số bộ Din ĐÃ BÁO</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center bg-blue-100">{ioCalculations.floors[f.id].dinReported || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold bg-blue-100">{ioCalculations.total.dinReported || ''}</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center">4</td>
                                        <td className="border border-black p-2 font-bold text-red-600">Số lượng CẦN BỔ SUNG</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => {
                                            const m = ioCalculations.floors[f.id].missing;
                                            return <td key={f.id} className={`border border-black p-2 text-center font-bold bg-red-50 ${m > 0 ? 'text-red-600' : ''}`}>{m > 0 ? m : '-'}</td>
                                        })}
                                        <td className={`border border-black p-2 text-center font-bold bg-red-50 ${ioCalculations.total.missing > 0 ? 'text-red-600' : ''}`}>{ioCalculations.total.missing > 0 ? ioCalculations.total.missing : '-'}</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                    </tr>
                                </tbody>
                            </table>
                            {!isPreview && (
                                <div className="mt-4 print-hidden no-print">
                                    <button onClick={addFloor} className="flex items-center px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow">
                                        <i data-lucide="plus" class="w-4 h-4 mr-2"></i> Thêm Tầng Mới
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderDetailedTable = () => {
                return (
                    <div className="w-full">
                        <table className="w-full border-collapse border border-black mb-6 text-[13px]">
                            <thead>
                                <tr className="bg-[#fff2cc] font-bold text-center">
                                    <td className="border border-black p-1 w-10">STT</td>
                                    <td className="border border-black p-1 w-24">Hình ảnh</td>
                                    <td className="border border-black p-1">Hạng mục / Mô tả / Hãng / Xuất xứ</td>
                                    <td className="border border-black p-1 w-12">Đơn vị</td>
                                    <td className="border border-black p-1 w-10">SL</td>
                                    <td className="border border-black p-1 w-16">Đơn giá</td>
                                    <td className="border border-black p-1 w-20">Thành tiền</td>
                                </tr>
                            </thead>
                            <tbody>
                                {detailedData.map((floor) => (
                                    <React.Fragment key={floor.id}>
                                        <tr className="bg-[#e2efda] font-bold text-sm avoid-break">
                                            <td colSpan={7} className="border border-black p-2 uppercase">
                                                <EditableInput value={floor.name} onChange={() => {}} isEditing={false} />
                                            </td>
                                        </tr>
                                        {floor.systems.map((system, sysIndex) => (
                                            <React.Fragment key={system.id}>
                                                <tr className="font-bold bg-white avoid-break">
                                                    <td className="border border-black p-1 text-center text-sm">{sysIndex + 1}</td>
                                                    <td colSpan={6} className="border border-black p-1 text-sm uppercase">{system.name}</td>
                                                </tr>
                                                {system.items.map((item, itemIdx) => (
                                                    <tr key={item.id} className="group hover:bg-gray-50 avoid-break bg-white">
                                                        <td className="border border-black p-1 text-center align-top relative font-bold print-td">
                                                            {sysIndex + 1}.{itemIdx + 1}
                                                            {!isPreview && (
                                                                <button onClick={() => deleteItemFromDetail(floor.id, item.id)} className="absolute top-1 left-1 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded print-hidden">
                                                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                                                </button>
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-1 align-middle print-td text-center">
                                                            <ImageUpload value={item.image} onChange={(v) => {
                                                                setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, image: v} : i)});
                                                            }} isEditing={!isPreview}/>
                                                        </td>
                                                        <td className="border border-black p-1 align-top break-words min-w-0 print-td">
                                                            <div className="font-bold mb-1">
                                                                <EditableInput value={item.name} onChange={(v) => {
                                                                    setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, name: v} : i)});
                                                                }} isEditing={!isPreview} />
                                                            </div>
                                                            <EditableInput value={item.desc} onChange={(v) => {
                                                                setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, desc: v} : i)});
                                                            }} placeholder="Mô tả kỹ thuật..." className="text-[12px] text-gray-700 italic leading-tight" isTextArea={true} isEditing={!isPreview} />
                                                            <EditableInput value={item.brand} onChange={(v) => {
                                                                setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, brand: v} : i)});
                                                            }} placeholder="Hãng / Xuất xứ" className="text-[12px] mt-1 text-gray-500 uppercase" isEditing={!isPreview} />
                                                        </td>
                                                        <td className="border border-black p-1 text-center align-middle print-td">{item.unit}</td>
                                                        <td className="border border-black p-1 text-center align-middle print-td font-bold">
                                                            {floor.id === 'common' ? item.qty : (
                                                                <EditableInput value={item.qty} onChange={(v) => updateBOMQuantity(floor.id, item.id, v)} className="text-center font-bold" isEditing={!isPreview} />

                                                        </td>
                                                        <td className="border border-black p-1 text-center align-middle print-td">
                                                            {isPreview ? formatMoney(item.price) : (
                                                                <EditableInput value={item.price} onChange={(v) => {
                                                                    setBomMap({...bomMap, items: bomMap.items.map(i => i.id === item.id ? {...i, price: v} : i)});
                                                                }} className="text-center" isEditing={true} />

                                                        </td>
                                                        <td className="border border-black p-1 text-right align-middle font-bold print-td">
                                                            {formatMoney(item.total)}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        ))}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                        
                        {includeAudio && (
                            <div className="mt-6 page-break-before">
                                <div className="text-red-600 font-bold text-sm uppercase mb-1">HẠNG MỤC NÂNG CAO:<br/>OPTION (ÂM THANH ĐA VÙNG)</div>
                                <table className="w-full border-collapse border border-black mb-6 text-[13px]">
                                    <tbody>
                                        {audioData.map((item, idx) => (
                                            <tr key={item.id} className="avoid-break group hover:bg-gray-50 bg-white">
                                                <td className="border border-black p-1 text-center align-middle font-bold text-red-600 print-td w-10">{idx + 1}</td>
                                                <td className="border border-black p-1 align-middle print-td w-24 text-center">
                                                    <ImageUpload value={item.image} onChange={(v) => {
                                                        const newD = [...audioData]; newD[idx].image = v; setAudioData(newD);
                                                    }} isEditing={!isPreview}/>
                                                </td>
                                                <td className="border border-black p-1 align-top break-words min-w-0 print-td">
                                                    <EditableInput value={item.name} onChange={v => { const newD = [...audioData]; newD[idx].name = v; setAudioData(newD); }} className="font-bold" isEditing={!isPreview} />
                                                    <EditableInput value={item.desc} onChange={v => { const newD = [...audioData]; newD[idx].desc = v; setAudioData(newD); }} className="text-[12px] mt-1 text-gray-700 leading-tight" isTextArea={true} isEditing={!isPreview} />
                                                </td>

                                                <td className="border border-black p-1 text-center align-middle print-td w-10 font-bold">

                                    <td className="border border-black p-2 w-10">STT</td>
                                    <td className="border border-black p-2">HẠNG MỤC ĐIỀU KHIỂN</td>
                                    <td className="border border-black p-2 w-28">Giá trị ({currency})</td>
                                    <td className="border border-black p-2 w-48">Ghi chú</td>
                                </tr>
                            </thead>
                            <tbody>
                                {detailedData.map((floor) => {
                                    if (floor.id === 'common') return null; 
                                    let floorTotal = floor.systems.reduce((sum, sys) => sum + sys.items.reduce((s, i) => s + i.total, 0), 0);
                                    grandTotal += floorTotal;
                                    
                                    return (
                                        <React.Fragment key={floor.id}>
                                            <tr className="font-bold bg-gray-50 avoid-break">
                                                <td className="border border-black p-1 text-center"></td>
                                                <td className="border border-black p-1 uppercase">{floor.name}</td>
                                                <td className="border border-black p-1 text-center">{formatMoney(floorTotal)}</td>
                                                <td className="border border-black p-1"></td>
                                            </tr>
                                            {floor.systems.map((sys, sysIndex) => {
                                                let sysTotal = sys.items.reduce((s, i) => s + i.total, 0);
                                                return (
                                                    <tr key={sys.id} className="avoid-break bg-white">
                                                        <td className="border border-black p-1 text-center">{sysIndex + 1}</td>
                                                        <td className="border border-black p-1 pl-4">{sys.name}</td>
                                                        <td className="border border-black p-1 text-center">{formatMoney(sysTotal)}</td>
                                                        <td className="border border-black p-1">
                                                            <EditableInput value={sys.note} onChange={(v) => {}} placeholder="Ghi chú..." isTextArea={true} isEditing={!isPreview} className="text-[11px]" />
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </React.Fragment>
                                    );
                                })}

                                {detailedData.find(f => f.id === 'common')?.systems.map((sys, idx) => {
                                    let sysTotal = sys.items.reduce((s, i) => s + i.total, 0);
                                    grandTotal += sysTotal;
                                    let defaultNote = sys.id.includes('An ninh') ? '- Báo trạng thái cửa ra vào tầng Trệt và sân thượng' : (sys.id.includes('Điều hòa') ? '- Điều khiển toàn bộ dàn lạnh trong nhà.' : '');
                                    return (
                                        <tr className="font-bold avoid-break bg-white" key={sys.id}>
                                            <td className="border border-black p-1 text-center">{detailedData.length + idx}</td>
                                            <td className="border border-black p-1 uppercase">{sys.name}</td>
                                            <td className="border border-black p-1 text-center">{formatMoney(sysTotal)}</td>
                                            <td className="border border-black p-1 font-normal">
                                                <EditableInput value={sys.note || defaultNote} onChange={() => {}} placeholder="Ghi chú..." isTextArea={true} isEditing={!isPreview} className="text-[11px]" />
                                            </td>
                                        </tr>
                                    );
                                })}

                                <tr className="font-bold avoid-break bg-white">
                                    <td className="border border-black p-1 text-center border-b-0">{bomMap.items.length + 1}</td>
                                    <td className="border border-black p-1 uppercase border-b-0 border-r-0">CHI PHÍ TRIỂN KHAI GIÁM SÁT, LẮP ĐẶT</td>
                                    <td className="border border-black p-1 text-center border-b-0 border-l-0">{formatMoney(implementationCosts.install)}</td>
                                    <td className="border border-black p-1 border-b-0"></td>
                                </tr>
                                <tr className="avoid-break bg-white">
                                    <td className="border border-black p-1 border-t-0"></td>
                                    <td className="border border-black p-1 text-[11px] border-t-0 border-r-0" colSpan={2}>
                                        <EditableInput value={"- Triển khai bản vẽ, cập nhật bản vẽ và hướng dẫn thi công\n- Đấu nối tủ điện, lắp đặt các thiết bị điều khiển.\n- Đấu nối công tắc, cảm biến, điều hòa.\n- Chạy thử, hiệu chỉnh, thay đổi, bàn giao, bảo hành."} onChange={() => {}} isTextArea={true} isEditing={!isPreview} />
                                    </td>
                                    <td className="border border-black p-1 border-t-0"></td>
                                </tr>

                                <tr className="font-bold avoid-break bg-white">
                                    <td className="border border-black p-1 text-center border-b-0">{bomMap.items.length + 2}</td>
                                    <td className="border border-black p-1 uppercase border-b-0 border-r-0">CHI PHÍ THIẾT KẾ, LẬP TRÌNH, SETUP HỆ THỐNG</td>
                                    <td className="border border-black p-1 text-center border-b-0 border-l-0">{formatMoney(implementationCosts.design)}</td>
                                    <td className="border border-black p-1 border-b-0"></td>
                                </tr>
                                <tr className="avoid-break bg-white">
                                    <td className="border border-black p-1 border-t-0"></td>
                                    <td className="border border-black p-1 text-[11px] border-t-0 border-r-0" colSpan={2}>
                                        <EditableInput value={"- Lập trình hệ thống Smart home. (chiếu sáng, rèm, điều hòa, an ninh, cổng....)\n- Thiết kế giao diện trên Smart phone, màn hình cảm ứng"} onChange={() => {}} isTextArea={true} isEditing={!isPreview} />
                                    </td>
                                    <td className="border border-black p-1 border-t-0"></td>
                                </tr>

                                <tr className="bg-[#e2efda] font-bold avoid-break">
                                    <td className="border border-black p-2 text-center" colSpan={2}>TỔNG GIÁ TRỊ SMARTHOME</td>
                                    <td className="border border-black p-2 text-right" colSpan={2}>{formatMoney(grandTotal)}</td>
                                </tr>
                                <tr className="bg-[#e2efda] font-bold avoid-break">
                                    <td className="border border-black p-2 text-center" colSpan={2}>THUẾ VAT 8%</td>
                                    <td className="border border-black p-2 text-right" colSpan={2}>{formatMoney(grandTotal * 0.08)}</td>
                                </tr>
                                <tr className="bg-[#e2efda] font-bold avoid-break">
                                    <td className="border border-black p-2 text-center border-b border-black" colSpan={2}>TỔNG GIÁ TRỊ SMARTHOME SAU THUẾ</td>
                                    <td className="border border-black p-2 text-right border-b border-black" colSpan={2}>{formatMoney(grandTotal * 1.08)}</td>
                                </tr>
                            </tbody>
                        </table>

                        {includeAudio && (
                            <div className="mt-6 page-break-before">
                                <div className="text-red-600 font-bold text-sm uppercase mb-1">HẠNG MỤC NÂNG CAO: OPTION (ÂM THANH ĐA VÙNG)</div>
                                <table className="w-full border-collapse border border-black mb-6 text-[13px]">
                                    <tbody>
                                        {audioData.map((item, idx) => {
                                            let itemTotal = (parseFloat(item.qty)||0) * (parseFloat(item.price)||0);
                                            audioTotal += itemTotal;
                                            return (
                                                <tr key={item.id} className="avoid-break bg-white">
                                                    <td className="border border-black p-1 text-center w-10 text-red-600 font-bold">{idx + 1}</td>
                                                    <td className="border border-black p-1">
                                                        <div className="font-bold">
                                                            <EditableInput value={item.name} onChange={v => { const newD = [...audioData]; newD[idx].name = v; setAudioData(newD); }} isEditing={!isPreview} />
                                                        </div>
                                                        <EditableInput value={item.desc} onChange={v => { const newD = [...audioData]; newD[idx].desc = v; setAudioData(newD); }} className="text-[12px] mt-1 text-gray-700 leading-tight" isTextArea={true} isEditing={!isPreview} />
                                                    </td>
                                                    <td className="border border-black p-1 text-center w-28 font-bold">{formatMoney(itemTotal)}</td>
                                                    <td className="border border-black p-1 w-48">
                                                        <EditableInput value={""} onChange={() => {}} placeholder="Ghi chú âm thanh..." isTextArea={true} className="text-[11px] italic" isEditing={!isPreview} />
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                        <tr className="bg-[#e2efda] font-bold avoid-break">
                                            <td className="border border-black p-2 text-center" colSpan={2}>TỔNG GIÁ TRỊ PHẦN ÂM THANH</td>
                                            <td className="border border-black p-2 text-right" colSpan={2}>{formatMoney(audioTotal)}</td>
                                        </tr>
                                        <tr className="bg-[#e2efda] font-bold avoid-break">
                                            <td className="border border-black p-2 text-center" colSpan={2}>THUẾ VAT 8%</td>
                                            <td className="border border-black p-2 text-right" colSpan={2}>{formatMoney(audioTotal * 0.08)}</td>
                                        </tr>
                                        <tr className="bg-[#e2efda] font-bold avoid-break">
                                            <td className="border border-black p-2 text-center border-b border-black" colSpan={2}>TỔNG GIÁ TRỊ ÂM THANH SAU THUẾ</td>
                                            <td className="border border-black p-2 text-right border-b border-black" colSpan={2}>{formatMoney(audioTotal * 1.08)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        )}

                        <div className="mt-6 text-[13px] avoid-break page-break-before">
                            <h3 className="font-bold text-red-600 underline mb-2 uppercase">Điều kiện thương mại và phạm vi cung cấp:</h3>
                            <p className="font-bold underline mb-1">Giá đã bao gồm thuế VAT</p>
                            <table className="w-full mb-3">
                                <tbody>
                                    {commercialTerms.slice(0, 4).map((term, idx) => (
                                        <tr key={idx} className="avoid-break">
                                            <td className="w-40 py-1 align-top">{term.label}</td>
                                            <td className="py-1">
                                                <EditableInput value={term.value} onChange={(v) => {
                                                    const newTerms = [...commercialTerms]; newTerms[idx].value = v; setCommercialTerms(newTerms);
                                                }} isTextArea={true} isEditing={!isPreview} className="leading-tight"/>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            <p className="font-bold underline mt-3 mb-1 avoid-break">Phạm vi cung cấp:</p>
                            <div className="pl-4 avoid-break">
                                <EditableInput value={commercialTerms[4].value} onChange={(v) => {
                                    const newTerms = [...commercialTerms]; newTerms[4].value = v; setCommercialTerms(newTerms);
                                }} isTextArea={true} isEditing={!isPreview} className="leading-tight"/>
                            </div>

                            <p className="font-bold underline mt-3 mb-1 avoid-break">Phạm vi không cung cấp (chưa bao gồm):</p>
                            <div className="pl-4 avoid-break">
                                <EditableInput value={commercialTerms[5].value} onChange={(v) => {
                                    const newTerms = [...commercialTerms]; newTerms[5].value = v; setCommercialTerms(newTerms);
                                }} isTextArea={true} isEditing={!isPreview} className="leading-tight"/>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen pb-10 ${isPreview ? 'bg-gray-200' : 'bg-gray-100'} font-sans`}>
                    
                    {/* Popup thông báo */}
                    {notification && (
                        <div className="fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-lg z-50 flex items-center print-hidden no-print">
                            <i data-lucide="info" class="w-5 h-5 mr-2 text-blue-400"></i>
                            {notification}
                        </div>
                    )}

                    {/* Thanh công cụ Preview In cố định */}
                    {isPreview && (
                        <div className="fixed top-0 left-0 right-0 bg-gray-900 text-white p-3 z-50 flex justify-center items-center gap-6 shadow-md print-hidden no-print">
                            <div className="font-bold text-yellow-400">XEM TRƯỚC BẢN IN</div>
                            <div className="flex items-center gap-2">
                                <span className="text-sm text-gray-400">KHỔ GIẤY:</span>
                                <button onClick={() => setPrintLayout('portrait')} className={`px-3 py-1 text-sm rounded ${printLayout === 'portrait' ? 'bg-gray-600' : 'bg-transparent hover:bg-gray-800'}`}>Dọc</button>
                                <button onClick={() => setPrintLayout('landscape')} className={`px-3 py-1 text-sm rounded ${printLayout === 'landscape' ? 'bg-gray-600' : 'bg-transparent hover:bg-gray-800'}`}>Ngang</button>
                            </div>
                            <div className="w-px h-6 bg-gray-600"></div>
                            <button onClick={() => window.print()} className="flex items-center px-4 py-1.5 bg-green-600 hover:bg-green-700 rounded text-sm font-bold">
                                <i data-lucide="printer" class="w-4 h-4 mr-2"></i> XUẤT PDF / IN
                            </button>
                            <button onClick={() => setIsPreview(false)} className="flex items-center px-4 py-1.5 bg-gray-600 hover:bg-gray-500 rounded text-sm ml-auto">
                                <i data-lucide="x" class="w-4 h-4 mr-2"></i> Trở lại
                            </button>
                        </div>
                    )}

                    {/* Thanh công cụ Soạn thảo */}
                    {!isPreview && (
                        <div className="max-w-6xl mx-auto bg-gray-900 text-white p-3 flex justify-between items-center no-print">
                            <div className="flex gap-2">
                                <button onClick={() => setActiveTab('bom')} className={`px-4 py-2 rounded ${activeTab === 'bom' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}>BOM Kỹ thuật</button>
                                <button onClick={() => setActiveTab('summary')} className={`px-4 py-2 rounded ${activeTab === 'summary' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}>Bảng Tổng Hợp</button>
                                <button onClick={() => setActiveTab('detailed')} className={`px-4 py-2 rounded ${activeTab === 'detailed' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}>Bảng Chi Tiết</button>
                            </div>
                            <div className="flex items-center gap-4">
                                <label className="flex items-center gap-2 cursor-pointer bg-gray-800 px-3 py-1.5 rounded text-sm">
                                    <input type="checkbox" checked={includeAudio} onChange={(e) => setIncludeAudio(e.target.checked)} className="form-checkbox text-blue-500" />
                                    <span>+ Âm thanh</span>
                                </label>
                                <div className="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded text-sm">
                                    <select value={currency} onChange={e => setCurrency(e.target.value)} className="bg-transparent border-none text-white focus:ring-0 cursor-pointer outline-none">
                                        <option value="USD">USD</option>
                                        <option value="VND">VNĐ</option>
                                    </select>
                                    {currency === 'VND' && (
                                        <input type="number" value={exchangeRate} onChange={e => setExchangeRate(Number(e.target.value))} className="w-20 bg-gray-700 text-white px-2 py-1 rounded text-center border-none focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Tỷ giá" />
                                    )}
                                </div>
                                <div className="h-6 w-px bg-gray-600 mx-1"></div>
                                <button onClick={handleExportData} className="flex items-center px-3 py-1.5 bg-blue-600 hover:bg-blue-700 rounded text-sm">
                                    <i data-lucide="download" class="w-4 h-4 mr-1"></i> Lưu File
                                </button>
                                <label className="flex items-center px-3 py-1.5 bg-orange-600 hover:bg-orange-700 rounded text-sm cursor-pointer">
                                    <i data-lucide="upload" class="w-4 h-4 mr-1"></i> Mở File
                                    <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                </label>
                                <button onClick={() => setIsPreview(true)} className="flex items-center px-4 py-1.5 bg-white text-gray-900 hover:bg-gray-200 rounded font-bold text-sm">
                                    <i data-lucide="printer" class="w-4 h-4 mr-2"></i> In PDF
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Vùng hiển thị giấy A4 */}
                    <div className={`${isPreview ? 'mt-20' : ''} print-no-shadow print-container ${!isPreview ? 'max-w-6xl mx-auto shadow-lg bg-white p-8' : (printLayout === 'portrait' ? 'a4-preview-portrait' : 'a4-preview-landscape')}`}>
                        
                        {/* Header thông tin (Ẩn khi ở tab BOM) */}
                        {activeTab !== 'bom' && (
                            <div className="flex justify-between items-start mb-4 border-b pb-4 avoid-break">
                                <div className="w-48 h-16">
                                    <ImageUpload value={headerInfo.logo} onChange={(v) => setHeaderInfo({...headerInfo, logo: v})} isEditing={!isPreview} />
                                </div>
                                <div className="text-right text-[12px] leading-tight text-gray-700">
                                    <div className="font-bold text-blue-900 text-[14px] mb-1">
                                        ASEL VIỆT NAM
                                    </div>
                                    <div className="font-bold">BMS & SMART HOME CENTER</div>
                                    <div>VPGD: Villa số 3, P. Thành Công, Q. Ba Đình, TP. Hà Nội</div>
                                    <div>Website: asel.vn</div>
                                </div>
                            </div>
                        )}

                        {activeTab !== 'bom' && (
                            <div className="flex justify-between text-[12px] mb-6 avoid-break leading-tight">
                                <div className="w-1/2 pr-2">
                                    <div className="flex mb-1"><strong className="w-20">Dự án:</strong> <EditableInput value={headerInfo.projectName} onChange={(v) => setHeaderInfo({...headerInfo, projectName: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-20">Quy mô:</strong> <EditableInput value="Biệt thự gia đình" onChange={() => {}} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-20">Địa chỉ:</strong> <EditableInput value={headerInfo.location} onChange={(v) => setHeaderInfo({...headerInfo, location: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-20">Phương án:</strong> <EditableInput value={headerInfo.plan} onChange={(v) => setHeaderInfo({...headerInfo, plan: v})} isEditing={!isPreview} /></div>
                                </div>
                                <div className="w-1/2 pl-2">
                                    <div className="flex mb-1"><strong className="w-24">Tư vấn dự án:</strong> <EditableInput value={headerInfo.consultant} onChange={(v) => setHeaderInfo({...headerInfo, consultant: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Số điện thoại:</strong> <EditableInput value={headerInfo.phone} onChange={(v) => setHeaderInfo({...headerInfo, phone: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Email:</strong> <EditableInput value={headerInfo.email} onChange={(v) => setHeaderInfo({...headerInfo, email: v})} isEditing={!isPreview} /></div>
                                    <div className="flex mb-1"><strong className="w-24">Ngày báo giá:</strong> <EditableInput value={headerInfo.date} onChange={(v) => setHeaderInfo({...headerInfo, date: v})} isEditing={!isPreview} /></div>
                                </div>
                            </div>
                        )}

                        {/* Tiêu đề giới thiệu (Chỉ hiển thị khi in hoặc ở Bảng) */}
                        {activeTab !== 'bom' && (
                            <div className="text-center mb-4 avoid-break print-header-text">
                                {isPreview ? (
                                    <div className="font-bold text-blue-800 text-[13px] uppercase">
                                        {headerInfo.introText}
                                    </div>
                                ) : (
                                    <div className="font-bold mb-1 text-[13px] text-blue-800 text-center">
                                        <EditableInput value={headerInfo.introText} onChange={(v) => setHeaderInfo({...headerInfo, introText: v})} isEditing={true} className="text-center" />
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Thân trang: Load các bảng tương ứng */}
                        {activeTab === 'bom' && renderBOM()}
                        {activeTab === 'detailed' && renderDetailedTable()}
                        {activeTab === 'summary' && renderSummaryTable()}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
