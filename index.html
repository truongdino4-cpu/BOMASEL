<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->

    <style>
        /* CSS cho chế độ Xem trước & In ấn */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0mm;
            }

            /* Xóa vạch xám nền thừa khi in */
            html, body, #root, .min-h-screen, .preview-mode-active {
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
                background-image: none !important;
                overflow: visible !important;
            }

            .print-hidden {
                display: none !important;
            }

            .print-page {
                box-shadow: none !important;
                background-color: transparent !important;
                margin: 0 !important;
                padding: 10mm 10mm !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
            }

            /* Chống cắt nửa dòng và neo tiêu đề */
            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .print-category-header, .print-floor-header, .print-keep-together {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* Ép trình duyệt in màu nền */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        .preview-mode-active {
            background-color: #e5e7eb;
            padding-top: 80px;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        .preview-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .preview-page-wrapper {
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
            padding: 15mm 15mm; 
        }

        .portrait-a4 { width: 210mm; }
        .landscape-a4 { width: 297mm; }

        .editable-input-static {
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 1.5em;
        }
    </style>
</head>
<body>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const IconX = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);

        const EditableInput = ({ value, onChange, placeholder = "", isNumber = false, className = "", isPreview = false, multiLine = false, prefix = "" }) => {
            const displayValue = isNumber ? (value > 0 ? Number(value).toLocaleString('en-US') : "") : value;
            if (isPreview) {
                return (
                    <div className={`editable-input-static ${className}`}>
                        {prefix}{displayValue || placeholder}
                    </div>
                );
            }
            return multiLine ? (
                <textarea
                    value={value || ""}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded px-1 resize-none overflow-hidden ${className}`}
                    rows={value ? value.toString().split('\n').length : 1}
                    onInput={(e) => {
                        e.target.style.height = 'auto';
                        e.target.style.height = e.target.scrollHeight + 'px';
                    }}
                />
            ) : (
                <input
                    type={isNumber ? "number" : "text"}
                    value={value || ""}
                    onChange={(e) => onChange(isNumber ? (parseFloat(e.target.value) || 0) : e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded px-1 ${className}`}
                />
            );
        };

                    { id: 'i1', category: 'I', categoryName: 'CHIẾU SÁNG', name: 'Bộ đóng cắt 8 kênh Din8s8wi', desc: 'Bộ điều khiển chiếu sáng 8 kênh. Kết hợp đầu vào cho nút công tắc.\nCông suất 10A / 1 kênh.\nHỗ trợ đóng cắt tải 120 đến 240 Volt 50/60 Hz.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 660, quantities: { tret: 3, t1: 2, t2: 3 }, isDinController: true },

                    { id: 'r1', category: 'II', categoryName: 'RÈM', name: 'Bộ đóng cắt cho rèm Din8s8wi', desc: 'Bộ điều khiển rèm động cơ.\nCông suất 10A / 1 kênh.\nHỗ trợ đóng cắt tải 120 đến 240 Volt 50/60 Hz.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 660, quantities: { tret: 3, t1: 1, t2: 1 }, isDinController: true },
                    
                    { id: 'p1', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Màn hình cảm ứng 10 inch', desc: 'Màn hình cảm ứng gắn tường chuyên dụng loại 10 inch nguồn POE, đi dây cố định, công nghệ cảm ứng điện dung. Hiển thị hình ảnh chuẩn HD.\nĐiều khiển và mô phỏng trực quan tổng thể hệ thống, kết nối chuông hình.\nCảm ứng tiệm cận khi đến gần tự động sáng màn hình.', brand: 'CRESTRON - USA/MEXICO', unit: 'Chiếc', price: 4500, quantities: { tret: 1, t1: 0, t2: 0 } },
                    { id: 'p2', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Key pad', desc: 'Keypad Phím bấm thông minh gắn tường - Phím vuông.\nKết hợp cảm biến ánh sáng khi trời tối nút bấm sẽ phát sáng.\nCó 2,4,6,8 hoặc 10 nút. Mỗi nút lập trình được nhiều chức năng, có chế độ ấn và ấn giữ.', brand: 'CRESTRON - USA/MEXICO', unit: 'Chiếc', price: 580, quantities: { tret: 2, t1: 2, t2: 4 } },
                    { id: 'p3', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Phím Pico loại 4 nút', desc: 'Công tắc không dây Pico 4 nút, biểu tượng đèn.\nLoại gắn tường, 1 cột 4 nút chức năng.', brand: 'LUTRON - USA/PRC', unit: 'Chiếc', price: 115, quantities: { tret: 0, t1: 1, t2: 1 } },
                    { id: 'p4', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Phím Pico loại 8 nút', desc: 'Công tắc không dây Pico 8 nút, biểu tượng đèn.\nLoại để bàn, 2 cột 4 nút chức năng.', brand: 'LUTRON - USA/PRC', unit: 'Chiếc', price: 230, quantities: { tret: 2, t1: 0, t2: 0 } },
                    { id: 'm1', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Công tắc cơ 4 nút', desc: '', brand: '', unit: 'Chiếc', price: 0, quantities: { tret: 2, t1: 4, t2: 5 }, isMechanical: true, buttons: 4 },
                    { id: 'm2', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Công tắc cơ 3 nút', desc: '', brand: '', unit: 'Chiếc', price: 0, quantities: { tret: 2, t1: 1, t2: 4 }, isMechanical: true, buttons: 3 },
                    { id: 'm3', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Công tắc cơ 2 nút', desc: '', brand: '', unit: 'Chiếc', price: 0, quantities: { tret: 2, t1: 1, t2: 1 }, isMechanical: true, buttons: 2 },
                    { id: 'm4', category: 'III', categoryName: 'Phím bấm, màn hình, công tắc', name: 'Công tắc cơ 1 nút', desc: '', brand: '', unit: 'Chiếc', price: 0, quantities: { tret: 2, t1: 1, t2: 1 }, isMechanical: true, buttons: 1 },
                    
                    { id: 'v1', category: 'IV', categoryName: 'An ninh', name: 'Cảm biến từ', desc: 'Cảm biến từ an ninh, báo mở cửa.', brand: 'PRC', unit: 'Chiếc', price: 8, quantities: { tret: 4, t1: 0, t2: 0 }, isInput: true },
                    { id: 'v2', category: 'IV', categoryName: 'An ninh', name: 'Cảm biến báo cháy', desc: 'Cảm biến báo cháy phát hiện khói, nhiệt.', brand: 'PRC', unit: 'Chiếc', price: 30, quantities: { tret: 2, t1: 0, t2: 0 } },
                    { id: 'v3', category: 'IV', categoryName: 'An ninh', name: 'Còi', desc: 'Còi báo động an ninh cường độ âm thanh cao.', brand: 'PRC', unit: 'Chiếc', price: 25, quantities: { tret: 1, t1: 0, t2: 0 } },
                    { id: 'v4', category: 'IV', categoryName: 'An ninh', name: 'Bộ báo tin nhắn', desc: 'Nhắn tin SMS và gọi điện trực tiếp đến SĐT đăng ký.', brand: 'ASEL', unit: 'Bộ', price: 500, quantities: { tret: 1, t1: 0, t2: 0 } },
                    
                    { id: 'ac1', category: 'V', categoryName: 'Điều hòa', name: 'Điều khiển điều hòa VRV (Cool Master)', desc: 'Điều khiển và giám sát trạng thái thực tới cả các dàn lạnh trong nhà.\nChỉ cần đi 1 cáp dây kết nối đến dàn nóng trung tâm.\nPhản hồi 02 chiều.', brand: 'COOLAUTOMATION - ISRAEL', unit: 'Bộ', price: 3500, quantities: { tret: 1, t1: 0, t2: 0 } },
                    
                    { id: 'c1', category: 'VI', categoryName: 'Chuông hình', name: 'Chuông cửa IP ngoài trời', desc: 'Gắn âm, tích hợp smartphone, xem lịch sử người bấm.\nChất liệu kim loại, camera hồng ngoại. Kết hợp relay mở cổng.\nKết nối đàm thoại với màn hình cảm ứng, điện thoại thông minh từ bất cứ đâu. Góc nhìn 180°.', brand: 'DB-GERMANY', unit: 'Chiếc', price: 1500, quantities: { tret: 1, t1: 0, t2: 0 } },
                    
                    { id: 't1', category: 'VII', categoryName: 'Tủ điện', name: 'Bộ xử lý mạng bus IP (Din AP4)', desc: '1GB SDRAM and 8 GB flash memory.\nTốc độ xử lý vượt trội 100 Mb/s.\nHỗ trợ RS-232, RS-422, RS-485.\nHỗ trợ điều khiển thiết bị qua hồng ngoại lên đến 1.2MHz.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 2800, quantities: { tret: 1, t1: 0, t2: 0 } },
                    { id: 't2', category: 'VII', categoryName: 'Tủ điện', name: 'Bộ cấp nguồn hệ thống 24V', desc: 'Công suất 60W Cresnet.\nNguồn vào 100-277V AC.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 400, quantities: { tret: 3, t1: 0, t2: 0 } },
                    { id: 't3', category: 'VII', categoryName: 'Tủ điện', name: 'Bộ khuếch đại', desc: 'Bộ khuếch đại tín hiệu hệ thống.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 600, quantities: { tret: 1, t1: 0, t2: 0 } },
                    { id: 't4', category: 'VII', categoryName: 'Tủ điện', name: 'Bộ nhận tín hiệu đầu vào công tắc', desc: 'Nhận tín hiệu đầu vào từ các nút bấm cơ.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 550, quantities: { tret: 2, t1: 0, t2: 0 } },
                    { id: 't5', category: 'VII', categoryName: 'Tủ điện', name: 'Bộ mở rộng Lutron', desc: 'Bộ mở rộng tín hiệu không dây cho các thiết bị Lutron.', brand: 'LUTRON - USA/PRC', unit: 'Bộ', price: 400, quantities: { tret: 3, t1: 0, t2: 0 } },
                    { id: 't6', category: 'VII', categoryName: 'Tủ điện', name: 'Vật tư phụ', desc: '(jack chuyên dụng, dây điều khiển, lạt nhựa, băng keo, đầu nối...)', brand: 'VIỆT NAM', unit: 'Gói', price: 500, quantities: { tret: 1, t1: 0, t2: 0 } },
                    { id: 't7', category: 'VII', categoryName: 'Tủ điện', name: 'Tủ điện', desc: 'Tủ điện 2 lớp cánh, sơn tĩnh điện dày 1.5mm', brand: 'VIỆT NAM', unit: 'Bộ', price: 500, quantities: { tret: 2, t1: 0, t2: 0 } },
                    
                    { id: 'cp1', category: 'VIII', categoryName: 'CP - Chi phí triển khai', name: 'Thiết kế lập trình (12%)', desc: '', brand: '', unit: 'Gói', price: 0, quantities: { tret: 1, t1: 0, t2: 0 }, isImplementationCost: true, type: 'design' },
                    { id: 'cp2', category: 'VIII', categoryName: 'CP - Chi phí triển khai', name: 'Thi công lắp đặt (13%)', desc: '', brand: '', unit: 'Gói', price: 0, quantities: { tret: 1, t1: 0, t2: 0 }, isImplementationCost: true, type: 'install' }
                ]
            });

            const [audioData, setAudioData] = useState([
                { id: 'a1', name: 'Thiết bị âm ly, nguồn nhạc', desc: 'Gồm 4 vùng độc lập: Phòng khách, ăn, truyền thống, tắm\n- 01 Bộ âm ly 4 vùng độc lập kết nối nguồn nhạc, đã bao gồm phần mềm kết nối điện thông minh.\n- 01 Nguồn phát nhạc số chuyên nghiệp cho phòng khách.\nCRESTRON - DENON', unit: 'Gói', qty: 1, price: 7500, note: '' },
                { id: 'a2', name: 'Thiết bị loa (5.5 cặp gắn trần)', desc: 'Dòng Reference 2-Way\n- 6.5" Woven Glass Fiber Woofer\n- 1" Silk Dome Tweeter\n- Sensitivity 87 dB @ 1W/1m\n- 100 Watts, Peak 200W\n- 8 Ohms nominal impedance\nCRESTRON', unit: 'Cặp', qty: 5.5, price: 800, note: '' },
                { id: 'a3', name: 'Chi phí thi công cài đặt, cân chỉnh hệ thống âm thanh', desc: '', unit: 'Gói', qty: 1, price: 810, note: '' }
            ]);

            // ==========================================
            // LOGIC CẢNH BÁO CHƯA LƯU FILE
            // ==========================================
            useEffect(() => {
                if (isInitialMount.current) {
                    isInitialMount.current = false;
                } else {
                    setHasUnsavedChanges(true);
                }
            }, [bomMap, companyInfo, audioData, exchangeRate, markup, vatRate, showAudio]);

            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (hasUnsavedChanges) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [hasUnsavedChanges]);

            const handleSaveFile = () => {
                const dataToSave = {
                    companyInfo,
                    bomMap,
                    audioData,
                    settings: { exchangeRate, markup, vatRate, showAudio }
                };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const safeName = companyInfo.project.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'du_an';
                const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
                a.download = `BaoGia_${safeName}_${dateStr}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                setHasUnsavedChanges(false);
                showPopup('Đã lưu file thành công!');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData.companyInfo && parsedData.bomMap) {
                            // Cập nhật ngày tháng thành ngày mở file (Thời gian thực)
                            parsedData.companyInfo.date = getCurrentDate();

                            setCompanyInfo(parsedData.companyInfo);
                            setBomMap(parsedData.bomMap);
                            if (parsedData.audioData) setAudioData(parsedData.audioData);
                            if (parsedData.settings) {
                                setExchangeRate(parsedData.settings.exchangeRate || 25000);
                                setMarkup(parsedData.settings.markup || 30);
                                setVatRate(parsedData.settings.vatRate !== undefined ? parsedData.settings.vatRate : 8);
                                setShowAudio(parsedData.settings.showAudio !== undefined ? parsedData.settings.showAudio : true);
                            }
                            
                            setTimeout(() => setHasUnsavedChanges(false), 100);
                            showPopup('Đã tải file dữ liệu thành công!');
                        } else {
                            showPopup('File không đúng định dạng!');
                        }
                    } catch (error) {
                        showPopup('Lỗi khi đọc file!');
                    }

            );

            return (
                <div className={`min-h-screen font-sans ${isPreview ? 'preview-mode-active' : 'bg-gray-100 p-4'}`}>
                    {popupMsg && (
                        <div className="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50 flex items-center print-hidden">
                            <span className="mr-2">✓</span> {popupMsg}
                        </div>
                    )}

                    {isPreview && (
                        <div className="preview-toolbar bg-gray-900 text-white p-3 flex justify-between items-center print-hidden">
                            <div className="flex items-center gap-4">
                                <span className="font-bold text-yellow-400">XEM TRƯỚC BẢN IN</span>
                                <div className="h-6 w-px bg-gray-600 mx-2"></div>
                                <span className="text-sm text-gray-300">Khổ giấy:</span>
                                <button onClick={() => setPrintLayout('portrait')} className={`px-3 py-1 rounded text-sm font-medium ${printLayout === 'portrait' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}>Dọc</button>
                                <button onClick={() => setPrintLayout('landscape')} className={`px-3 py-1 rounded text-sm font-medium ${printLayout === 'landscape' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'}`}>Ngang</button>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => window.print()} className="flex items-center gap-2 bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-bold transition">
                                    <IconPrinter /> XUẤT PDF / IN
                                </button>
                                <button onClick={() => setIsPreview(false)} className="flex items-center gap-2 bg-red-600 hover:bg-red-500 px-4 py-2 rounded transition">
                                    <IconX /> Trở lại
                                </button>
                            </div>
                            <style>{`@media print { @page { size: A4 ${printLayout}; } }`}</style>
                        </div>
                    )}

                    <div className={`${isPreview ? `preview-page-wrapper ${printLayout === 'portrait' ? 'portrait-a4' : 'landscape-a4'}` : 'max-w-7xl mx-auto bg-white rounded-lg shadow-lg'} print-page`}>
                        
                        {!isPreview && (
                            <div className="border-b bg-gray-50 rounded-t-lg p-4 flex justify-between items-center print-hidden">
                                <div className="flex gap-2">
                                    <button onClick={() => setActiveTab('bom')} className={`px-4 py-2 rounded-t-lg font-bold transition ${activeTab === 'bom' ? 'bg-white border-t border-l border-r text-blue-600 shadow-[0_2px_0_white]' : 'text-gray-500 hover:bg-gray-200'}`}>1. BẢNG BOM NHÁP</button>
                                    <button onClick={() => setActiveTab('detail')} className={`px-4 py-2 rounded-t-lg font-bold transition ${activeTab === 'detail' ? 'bg-white border-t border-l border-r text-blue-600 shadow-[0_2px_0_white]' : 'text-gray-500 hover:bg-gray-200'}`}>2. BẢNG CHI TIẾT</button>
                                    <button onClick={() => setActiveTab('summary')} className={`px-4 py-2 rounded-t-lg font-bold transition ${activeTab === 'summary' ? 'bg-white border-t border-l border-r text-blue-600 shadow-[0_2px_0_white]' : 'text-gray-500 hover:bg-gray-200'}`}>3. BẢNG TỔNG HỢP</button>
                                </div>
                                
                                <div className="flex items-center gap-3">
                                    {hasUnsavedChanges && <span className="text-xs text-orange-500 font-bold animate-pulse">● Có thay đổi chưa lưu</span>}
                                    <button onClick={handleSaveFile} className="flex items-center gap-1 bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded text-sm font-bold border border-blue-300 transition">
                                        <IconSave /> Lưu File
                                    </button>
                                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".json" className="hidden" />
                                    <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded text-sm font-bold border border-gray-300 transition">
                                        <IconFolderOpen /> Mở File
                                    </button>
                                    <div className="w-px h-6 bg-gray-300 mx-1"></div>
                                    <button onClick={() => { setActiveTab('summary'); setIsPreview(true); }} className="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm font-bold shadow transition">
                                        <IconPrinter /> XEM TRƯỚC & IN
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className={`${isPreview ? '' : 'p-6'}`}>
                            <div className={`${activeTab === 'bom' && !isPreview ? 'block' : 'hidden'}`}>
                                {renderBOM()}
                            </div>
                            <div className={`${activeTab === 'detail' || (isPreview && activeTab === 'detail') ? 'block' : 'hidden'}`}>
                                {renderDetailedTable()}
                            </div>
                            <div className={`${activeTab === 'summary' || (isPreview && activeTab === 'summary') ? 'block' : 'hidden'}`}>
                                {renderSummaryTable()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuotationTool />);
    </script>
</body>
</html>
