<!DOCTYPE html>
<html lang="vi">
<head>

    <style>
        /* --- MÔ PHỎNG GIẤY TRÊN MÀN HÌNH XEM TRƯỚC --- */
        body { margin: 0; padding: 0; background-color: #525659; font-family: 'Inter', sans-serif; }
        
        .is-preview-mode {
            width: var(--preview-width, 210mm) !important;
            max-width: var(--preview-width, 210mm) !important;
            min-height: auto !important;
            margin: 20px auto !important;
            padding: 15mm 15mm !important;
            background: white !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
        }

        /* --- CẤU HÌNH IN ẤN & XUẤT PDF CHUYÊN NGHIỆP --- */
        @media print {
            body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact !important; 
                color-adjust: exact !important;
                print-color-adjust: exact !important;
                padding: 0 !important; 
                margin: 0 !important;
            }
            .print\:hidden { display: none !important; }
            
            .is-preview-mode, .preview-container {
                width: 100% !important;
                max-width: none !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 10mm !important;
                box-shadow: none !important;
            }
            
            textarea::placeholder, input::placeholder { color: transparent !important; }
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }

        const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const ImageIcon = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Icon>;

        // --- COMPONENTS ---
        const EditableInput = ({ value, onChange, placeholder = "", className = "", isTextArea = false, isEditing = true }) => {
            if (!isEditing) {
                if (!value && value !== 0) return null;
                return <div className={`whitespace-pre-wrap break-words min-w-0 ${className}`}>{value}</div>;
            }
            return isTextArea ? (
                <textarea
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 resize-none outline-none break-words min-w-0 ${className}`}
                    rows={1}
                    onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                />
            ) : (
                <input
                    type="text"
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 outline-none break-words min-w-0 ${className}`}
                />
            );
        };

        const ImageUpload = ({ value, onChange, isEditing = true }) => {
            const fileInputRef = useRef(null);
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => onChange(reader.result);
                    reader.readAsDataURL(file);
                }
            };
            return (
                <div className="flex flex-col items-center justify-center w-full h-full min-h-[50px]">
                    {value ? (
                        <div className="relative group w-full h-full flex items-center justify-center">
                            <img src={value} alt="Uploaded" className="max-w-full object-contain cursor-pointer" style={{ maxHeight: '60px' }} onClick={() => isEditing && fileInputRef.current?.click()} />
                            {isEditing && (
                                <button onClick={(e) => { e.stopPropagation(); onChange(''); }} className="absolute top-0 right-0 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity print:hidden" title="Xóa ảnh">
                                    <X size={12} />
                                </button>
                            )}
                        </div>
                    ) : (
                        isEditing ? (
                            <div onClick={() => fileInputRef.current?.click()} className="cursor-pointer flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 print:hidden w-full h-full min-h-[50px] border border-dashed border-gray-300 rounded p-1">
                                <ImageIcon size={18} />
                                <span className="text-[10px] text-center mt-0.5">Tải ảnh</span>
                            </div>
                        ) : null
                    )}
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                </div>
            );
        };

                { label: 'Hiệu lực báo giá', value: 'Trong thời hạn 30 ngày kể từ ngày báo giá.' },

                { label: 'Phạm vi không cung cấp (chưa bao gồm):', value: 'Thiết bị đầu cuối (thiết bị được điều khiển): Đèn, điều hòa, rèm động cơ, động cơ cổng, bơm, quạt hút\nCông tắc và ổ cắm điện thường (chủ đầu tư chọn sau)\nCamera (bên ME cấp). Smart home tích hợp miễn phí tất cả các hãng camera IP\nChi phí vật tư và nhân công thi công, ống, dây (dây điện, dây điều khiển, dây loa)' }
            ]);

            const handleExportData = () => {
                const dataToSave = { headerInfo, bomMap, audioData, commercialTerms, includeAudio, exchangeRate, currency };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `BaoGia_${headerInfo.owner.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.headerInfo) setHeaderInfo(parsed.headerInfo);
                        if (parsed.bomMap) setBomMap(parsed.bomMap);
                        if (parsed.audioData) setAudioData(parsed.audioData);
                        if (parsed.commercialTerms) setCommercialTerms(parsed.commercialTerms);
                        if (parsed.includeAudio !== undefined) setIncludeAudio(parsed.includeAudio);
                        if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
                        if (parsed.currency) setCurrency(parsed.currency);
                    } catch (err) { alert("File không hợp lệ hoặc bị lỗi!"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const hardwareTotal = useMemo(() => {
                return bomMap.items.reduce((sum, item) => {
                    if (item.isImplementationCost) return sum;
                    const totalQty = bomMap.floors.reduce((qSum, f) => qSum + (parseFloat(item.quantities[f.id]) || 0), 0);
                    return sum + (totalQty * (parseFloat(item.price) || 0));
                }, 0);
            }, [bomMap]);

            const implementationCosts = useMemo(() => {
                return { design: hardwareTotal * 0.12, install: hardwareTotal * 0.13 };
            }, [hardwareTotal]);

            const ioCalculations = useMemo(() => {
                const calc = { floors: {}, total: { input: 0, dinNeed: 0, dinReported: 0, missing: 0 } };
                bomMap.floors.forEach(f => { calc.floors[f.id] = { input: 0, dinReported: 0, dinNeed: 0, missing: 0 }; });

                bomMap.items.forEach(item => {
                    const nameLower = (item.name || "").toLowerCase();
                    const isStairSensor = nameLower.includes('cảm biến cầu thang');
                    const isCeilingSensor = nameLower.includes('cảm biến gắn trần');
                    const isDoorSensor = nameLower.includes('cảm biến từ');
                    const isMech1 = nameLower.includes('công tắc cơ 1 nút');
                    const isMech2 = nameLower.includes('công tắc cơ 2 nút');
                    const isMech3 = nameLower.includes('công tắc cơ 3 nút');
                    const isMech4 = nameLower.includes('công tắc cơ 4 nút');
                    const isDinController = item.isDinController;

                    bomMap.floors.forEach(f => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        let floorInputs = 0;
                        if (isStairSensor || isCeilingSensor || isDoorSensor) floorInputs += qty;
                        if (isMech1) floorInputs += qty * 1;
                        if (isMech2) floorInputs += qty * 2;
                        if (isMech3) floorInputs += qty * 3;
                        if (isMech4) floorInputs += qty * 4;

                        calc.floors[f.id].input += floorInputs;
                        calc.total.input += floorInputs;

                        if (isDinController) {
                            calc.floors[f.id].dinReported += qty;
                            calc.total.dinReported += qty;
                        }
                    });
                });

                bomMap.floors.forEach(f => {
                    calc.floors[f.id].dinNeed = Math.ceil(calc.floors[f.id].input / 8);
                    const diff = calc.floors[f.id].dinNeed - calc.floors[f.id].dinReported;
                    calc.floors[f.id].missing = diff > 0 ? diff : 0;
                });
                calc.total.dinNeed = Math.ceil(calc.total.input / 8);
                const totalDiff = calc.total.dinNeed - calc.total.dinReported;
                calc.total.missing = totalDiff > 0 ? totalDiff : 0;

                return calc;
            }, [bomMap]);

            const detailedData = useMemo(() => {
                let floorsData = [];
                bomMap.floors.forEach(f => {
                    let systemsMap = {};
                    bomMap.items.forEach(item => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (qty > 0 && !item.isMechanical && !item.isImplementationCost) {
                            const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                            if (!isCommonSystem) {
                                const sysName = `${item.categoryName}`;
                                if (!systemsMap[sysName]) systemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                                systemsMap[sysName].items.push({ ...item, qty, total: qty * item.price });
                            }
                        }
                    });
                    if (Object.keys(systemsMap).length > 0) floorsData.push({ id: f.id, name: f.name, systems: Object.values(systemsMap) });
                });

                let commonSystemsMap = {};
                bomMap.items.forEach(item => {
                    const isCommonSystem = ['IV', 'V', 'VI', 'VII'].includes(item.category);
                    if (isCommonSystem && !item.isMechanical && !item.isImplementationCost) {
                        const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                        if (totalQty > 0) {
                            const sysName = `${item.categoryName}`;
                            if (!commonSystemsMap[sysName]) commonSystemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                            commonSystemsMap[sysName].items.push({ ...item, qty: totalQty, total: totalQty * item.price });
                        }
                    }
                });
                if (Object.keys(commonSystemsMap).length > 0) floorsData.push({ id: 'common', name: 'HỆ THỐNG CHUNG', systems: Object.values(commonSystemsMap) });

                return floorsData;
            }, [bomMap]);

            const updateBOMQuantity = (floorId, itemId, newQtyStr) => {
                const qty = parseFloat(newQtyStr);
                const finalQty = isNaN(qty) ? '' : qty;
                
                setBomMap(prev => {
                    const newItems = prev.items.map(item => {
                        if (item.id === itemId) {
                            return { ...item, quantities: { ...item.quantities, [floorId]: finalQty } };
                        }
                        return item;
                    });
                    return { ...prev, items: newItems };
                });
            };

            const addFloor = () => {
                const newId = `t${Date.now()}`;
                setBomMap(prev => {
                    let newFloors = [...prev.floors];
                    newFloors.push({ id: newId, name: `Tầng ${prev.floors.length + 1}` });
                    return { ...prev, floors: newFloors };
                });
            };

            const removeFloor = (floorId) => {
                setBomMap(prev => ({ ...prev, floors: prev.floors.filter(f => f.id !== floorId) }));
            };

            const deleteItemFromDetail = (floorId, itemId) => { 
                updateBOMQuantity(floorId, itemId, 0); 
            };

            const renderBOM = () => {
                const groupedItems = bomMap.items.reduce((acc, item) => {
                    if (!acc[item.category]) acc[item.category] = { categoryName: item.categoryName, items: [] };
                    acc[item.category].items.push(item);
                    return acc;
                }, {});

                return (
                    <div className="w-full">
                        <h2 className="text-xl font-bold text-center mb-4 uppercase">BẢNG THỐNG KÊ KHỐI LƯỢNG THIẾT BỊ</h2>
                        <div className="overflow-x-auto pb-4">
                            <table className="w-full border-collapse border border-black min-w-[800px] text-[13px] table-fixed">
                                <thead>
                                    <tr className="bg-[#d5e8d4] font-bold text-center">
                                        <td className="border border-black p-1 w-10">Mã</td>
                                        <td className="border border-black p-1">Hạng mục</td>
                                        <td className="border border-black p-1 w-14">ĐVT</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 w-12 group relative">
                                                <EditableInput value={f.name} onChange={(v) => {
                                                    setBomMap({ ...bomMap, floors: bomMap.floors.map(fl => fl.id === f.id ? { ...fl, name: v } : fl) });
                                                }} className="text-center font-bold text-xs" isEditing={!isPreview} />
                                                {!isPreview && bomMap.floors.length > 1 && (
                                                    <button onClick={() => removeFloor(f.id)} className="absolute -top-2 -right-2 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded-full border shadow print:hidden" title="Xóa tầng">
                                                        <X size={14} />
                                                    </button>
                                                )}
                                            </td>
                                        ))}
                                        <td className="border border-black p-1 w-12">Tổng</td>
                                        <td className="border border-black p-1 w-20">Đơn giá</td>
                                        <td className="border border-black p-1 w-24">Thành tiền</td>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.keys(groupedItems).map((catKey) => (
                                        <React.Fragment key={catKey}>
                                            <tr className="bg-[#e2efda] font-bold">
                                                <td className="border border-black p-1 text-center">{catKey}</td>
                                                <td className="border border-black p-1 uppercase" colSpan={bomMap.floors.length + 4}>{groupedItems[catKey].categoryName}</td>
                                            </tr>
                                            {groupedItems[catKey].items.map((item, idx) => {
                                                const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                                                let displayPrice = item.price;
                                                let displayTotal = totalQty * item.price;
                                                if (item.isImplementationCost) {
                                                    displayPrice = item.type === 'design' ? implementationCosts.design : implementationCosts.install;
                                                    displayTotal = displayPrice;
                                                }
                                                return (
                                                    <tr key={item.id} className={item.isMechanical ? "text-gray-600 bg-gray-50" : ""}>
                                                        <td className="border border-black p-1 text-center font-bold">{idx + 1}</td>
                                                        <td className="border border-black p-1">
                                                            <EditableInput value={item.name} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, name: v } : i) });
                                                            }} isEditing={!isPreview} className="text-xs" />
                                                        </td>
                                                        <td className="border border-black p-1 text-center">{item.unit}</td>
                                                        {item.isImplementationCost ? (
                                                            <td colSpan={bomMap.floors.length + 1} className="border border-black p-1 text-center text-gray-400 bg-gray-50 text-[11px]">- Tự Động Tính -</td>
                                                        ) : (
                                                            <>
                                                                {bomMap.floors.map(f => (
                                                                    <td key={f.id} className="border border-black p-0.5 text-center">
                                                                        <input type="number" value={item.quantities[f.id] === 0 ? '' : (item.quantities[f.id] || '')} onChange={(e) => updateBOMQuantity(f.id, item.id, e.target.value)} className="w-full text-center border-none focus:ring-1 focus:ring-blue-500 bg-transparent print:hidden outline-none" style={{ display: isPreview ? 'none' : 'block' }} />
                                                                        {isPreview && <div className="text-center">{item.quantities[f.id] || ''}</div>}
                                                                    </td>
                                                                ))}
                                                                <td className="border border-black p-1 text-center font-bold bg-gray-50">{totalQty > 0 ? totalQty : ''}</td>
                                                            </>
                                                        )}
                                                        <td className="border border-black p-1 text-center">
                                                            {item.isImplementationCost ? '-' : (
                                                                <EditableInput value={item.price} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, price: v } : i) });
                                                                }} className="text-center" isEditing={true} />
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-1 text-right font-bold text-green-800 bg-green-50">{formatMoney(displayTotal)}</td>
                                                    </tr>
                                                );
                                            })}
                                        </React.Fragment>
                                    ))}

                                    {/* Bảng IO Tích hợp */}
                                    <tr className="bg-[#e2efda] font-bold mt-2">
                                        <td className="border border-black p-1 text-center">IX</td>
                                        <td className="border border-black p-1 uppercase" colSpan={bomMap.floors.length + 4}>TÍNH TOÁN ĐẦU VÀO IO</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-1 text-center font-bold">1</td>
                                        <td className="border border-black p-1 text-blue-900">Tổng số đầu vào Input (Cảm biến + Công tắc cơ)</td>
                                        <td className="border border-black p-1 text-center">-</td>
                                        {bomMap.floors.map(f => {
                                            let fInput = 0;
                                            bomMap.items.forEach(item => {
                                                const q = parseFloat(item.quantities[f.id]) || 0;
                                                const nameL = (item.name || "").toLowerCase();
                                                if (nameL.includes('cảm biến cầu thang') || nameL.includes('cảm biến gắn trần') || nameL.includes('cảm biến từ')) fInput += q;
                                                if (nameL.includes('công tắc cơ 1 nút')) fInput += q * 1;
                                                if (nameL.includes('công tắc cơ 2 nút')) fInput += q * 2;
                                                if (nameL.includes('công tắc cơ 3 nút')) fInput += q * 3;
                                                if (nameL.includes('công tắc cơ 4 nút')) fInput += q * 4;
                                            });
                                            return <td key={f.id} className="border border-black p-1 text-center font-bold bg-orange-50">{fInput || ''}</td>
                                        })}
                                        <td className="border border-black p-1 text-center font-bold bg-orange-50">{ioCalculations.total.input || ''}</td>
                                        <td colSpan={2} className="border border-black p-1 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-1 text-center font-bold">2</td>
                                        <td className="border border-black p-1">Số bộ DIN8s-8i CẦN (Chia 8 làm tròn lên)</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center">{ioCalculations.floors[f.id].dinNeed || ''}</td>
                                        ))}
                                        <td className="border border-black p-1 text-center font-bold">{ioCalculations.total.dinNeed || ''}</td>
                                        <td colSpan={2} className="border border-black p-1 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-1 text-center font-bold">3</td>
                                        <td className="border border-black p-1 text-green-700">Tổng số bộ DIN8s-8i ĐÃ BÁO (CS + Rèm)</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-1 text-center bg-blue-100 font-bold">{ioCalculations.floors[f.id].dinReported || ''}</td>
                                        ))}
                                        <td className="border border-black p-1 text-center font-bold bg-blue-100">{ioCalculations.total.dinReported || ''}</td>
                                        <td colSpan={2} className="border border-black p-1 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-1 text-center font-bold">4</td>
                                        <td className="border border-black p-1 font-bold uppercase">Số lượng CẦN BỔ SUNG (Thiếu)</td>
                                        <td className="border border-black p-1 text-center">Bộ</td>
                                        {bomMap.floors.map(f => {
                                            const m = ioCalculations.floors[f.id].missing;
                                            return <td key={f.id} className={`border border-black p-1 text-center font-bold bg-yellow-100 ${m > 0 ? 'text-red-600' : ''}`}>{m > 0 ? m : '-'}</td>
                                        })}
                                        <td className={`border border-black p-1 text-center font-bold bg-yellow-100 ${ioCalculations.total.missing > 0 ? 'text-red-600' : ''}`}>{ioCalculations.total.missing > 0 ? ioCalculations.total.missing : '-'}</td>
                                        <td colSpan={2} className="border border-black p-1 text-center text-xs italic text-gray-500">(Đã báo trừ Cần, lấy số dương)</td>
                                    </tr>
                                </tbody>
                            </table>
                            {!isPreview && (
                                <div className="mt-4 print:hidden">
                                    <button onClick={addFloor} className="flex items-center px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow text-sm font-bold">
                                        <Plus size={16} className="mr-2" /> THÊM TẦNG MỚI
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderDetailedTable = () => {
                return (
                    <div className="w-full">
                        <table className="w-full border-collapse border border-black mb-4 text-[13px] table-fixed">
                            <thead>
                                <tr className="bg-[#fff2cc] font-bold text-center">
                                    <td className="border border-black p-1 w-10">STT</td>
                                    <td className="border border-black p-1 w-20">Hình ảnh</td>
                                    <td className="border border-black p-1">Hạng mục / Mô tả / Hãng / Xuất xứ</td>
                                    <td className="border border-black p-1 w-14">Đơn vị</td>
                                    <td className="border border-black p-1 w-12">SL</td>
                                    <td className="border border-black p-1 w-20">Đơn giá</td>
                                    <td className="border border-black p-1 w-24">Thành tiền</td>
                                </tr>
                            </thead>
                            <tbody>
                                {detailedData.map((floor) => (
                                    <React.Fragment key={floor.id}>
                                        <tr className="bg-[#e2efda] font-bold text-sm">
                                            <td colSpan={7} className="border border-black p-1.5 uppercase">
                                                <EditableInput value={floor.name} onChange={() => { }} isEditing={false} />
                                            </td>
                                        </tr>
                                        {floor.systems.map((system, sysIndex) => (
                                            <React.Fragment key={system.id}>
                                                <tr className="font-bold bg-white">
                                                    <td className="border border-black p-1.5 text-center">{sysIndex + 1}</td>
                                                    <td colSpan={6} className="border border-black p-1.5 uppercase">{system.name}</td>
                                                </tr>
                                                {system.items.map((item, itemIdx) => (
                                                    <tr key={item.id} className="group hover:bg-gray-50">
                                                        <td className="border border-black p-1 text-center align-top relative font-bold">
                                                            {sysIndex + 1}.{itemIdx + 1}
                                                            {!isPreview && (
                                                                <button onClick={() => deleteItemFromDetail(floor.id, item.id)} className="absolute top-1 left-0.5 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded print:hidden shadow border" title="Xóa khỏi tầng">
                                                                    <Trash2 size={12} />
                                                                </button>
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-1 align-top">
                                                            <ImageUpload value={item.image} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, image: v } : i) });
                                                            }} isEditing={!isPreview} />
                                                        </td>
                                                        <td className="border border-black p-1 align-top break-words min-w-0">
                                                            <div className="font-bold mb-0.5">
                                                                <EditableInput value={item.name} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, name: v } : i) });
                                                                }} isEditing={!isPreview} />
                                                            </div>
                                                            <EditableInput value={item.desc} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, desc: v } : i) });
                                                            }} placeholder="Mô tả kỹ thuật..." className="text-[12px] text-gray-600 leading-tight italic" isTextArea={true} isEditing={!isPreview} />
                                                            <div className="mt-1 text-[11px] text-gray-800 uppercase">
                                                                <EditableInput value={item.brand} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, brand: v } : i) });
                                                                }} placeholder="Hãng / Xuất xứ" isEditing={!isPreview} />
                                                            </div>
                                                        </td>
                                                        <td className="border border-black p-1 text-center align-middle">{item.unit}</td>
                                                        <td className="border border-black p-1 text-center align-middle font-bold">
                                                            {floor.id === 'common' ? item.qty : (
                                                                <EditableInput value={item.qty} onChange={(v) => updateBOMQuantity(floor.id, item.id, v)} className="text-center font-bold" isEditing={!isPreview} />
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-1 text-center align-middle">
                                                            <EditableInput value={item.price} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, price: v } : i) });
                                                            }} className="text-center" isEditing={!isPreview} />
                                                        </td>
                                                        <td className="border border-black p-1 text-right align-middle font-bold">
                                                            {formatMoney(item.total)}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        ))}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>

                        {includeAudio && (
                            <div className="mt-4">
                                <div className="text-red-600 font-bold text-sm uppercase mb-1">HẠNG MỤC NÂNG CAO:<br />OPTION (ÂM THANH ĐA VÙNG)</div>
                                <table className="w-full border-collapse border border-black mb-4 text-[13px] table-fixed">
                                    <tbody>
                                        {audioData.map((item, idx) => (
                                            <tr key={item.id}>
                                                <td className="border border-black p-1 text-center align-top font-bold text-red-600 w-10">{idx + 1}</td>
                                                <td className="border border-black p-1 align-top w-20">
                                                    <ImageUpload value={item.image} onChange={(v) => {
                                                        const newD = [...audioData]; newD[idx].image = v; setAudioData(newD);
                                                    }} isEditing={!isPreview} />
                                                </td>
                                                <td className="border border-black p-1 align-top break-words min-w-0">
                                                    <div className="font-bold mb-0.5">
                                                        <EditableInput value={item.name} onChange={v => { const newD = [...audioData]; newD[idx].name = v; setAudioData(newD); }} isEditing={!isPreview} />
                                                    </div>
                                                    <EditableInput value={item.desc} onChange={v => { const newD = [...audioData]; newD[idx].desc = v; setAudioData(newD); }} className="text-[12px] leading-tight" isTextArea={true} isEditing={!isPreview} />
                                                </td>
                                                <td className="border border-black p-1 text-center align-middle w-14">{item.unit}</td>
                                                <td className="border border-black p-1 text-center align-middle font-bold w-12">
                                                    <EditableInput value={item.qty} onChange={v => { const newD = [...audioData]; newD[idx].qty = v; setAudioData(newD); }} className="text-center font-bold" isEditing={!isPreview} />
                                                </td>
                                                <td className="border border-black p-1 text-center align-middle w-20">
                                                    <EditableInput value={item.price} onChange={v => { const newD = [...audioData]; newD[idx].price = v; setAudioData(newD); }} className="text-center" isEditing={!isPreview} />
                                                </td>
                                                <td className="border border-black p-1 text-right align-middle font-bold w-24">{formatMoney((parseFloat(item.qty) || 0) * (parseFloat(item.price) || 0))}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                );
            };

            const renderSummaryTable = () => {
                let grandTotal = implementationCosts.design + implementationCosts.install;
                let audioTotal = 0;
                let smartHomeRowIdx = 1;

                return (
                    <div className="w-full">
                        <h2 className="text-xl font-bold text-center mb-4 mt-2 uppercase">BẢNG DỰ TOÁN TỔNG HỢP PHƯƠNG ÁN {headerInfo.plan}</h2>
                        <table className="w-full border-collapse border border-black mb-4 text-[13px] table-fixed">
                            <thead>
                                <tr className="bg-[#a9d08e] font-bold text-center">
                                    <td className="border border-black p-1.5 w-12">STT</td>
                                    <td className="border border-black p-1.5">HẠNG MỤC ĐIỀU KHIỂN</td>
                                    <td className="border border-black p-1.5 w-32">Giá trị ({currency})</td>
                                </tr>
                            </thead>
                            <tbody>
                                {detailedData.map((floor) => {
                                    if (floor.id === 'common') return null;
                                    let floorTotal = floor.systems.reduce((sum, sys) => sum + sys.items.reduce((s, i) => s + i.total, 0), 0);
                                    grandTotal += floorTotal;
                                    
                                    if (floorTotal === 0) return null;

                                    return (
                                        <React.Fragment key={floor.id}>
                                            <tr className="font-bold bg-gray-50">
                                                <td className="border border-black p-1 text-center"></td>
                                                <td className="border border-black p-1 uppercase">{floor.name}</td>
                                                <td className="border border-black p-1 text-right pr-2">{formatMoney(floorTotal)}</td>
                                            </tr>
                                            {floor.systems.map((sys) => {
                                                let sysTotal = sys.items.reduce((s, i) => s + i.total, 0);
                                                return (
                                                    <React.Fragment key={sys.id}>
                                                        <tr className="font-bold">
                                                            <td className="border border-black p-1 text-center">{smartHomeRowIdx++}</td>
                                                            <td className="border border-black p-1 pl-6">{sys.name}</td>
                                                            <td className="border border-black p-1 text-right pr-2">{formatMoney(sysTotal)}</td>
                                                        </tr>
                                                        <tr>
                                                            <td className="border border-black p-1 border-t-0 border-r-0"></td>
                                                            <td className="border border-black p-1 text-[12px] italic border-t-0 border-l-0 text-gray-600 leading-tight" colSpan={2}>
                                                                <EditableInput value={sys.note} onChange={() => { }} placeholder="Ghi chú hệ thống..." isTextArea={true} isEditing={!isPreview} />
                                                            </td>
                                                        </tr>
                                                    </React.Fragment>
                                                );
                                            })}
                                        </React.Fragment>
                                    );
                                })}

                                {detailedData.find(f => f.id === 'common')?.systems.map((sys) => {
                                    let sysTotal = sys.items.reduce((s, i) => s + i.total, 0);
                                    grandTotal += sysTotal;
                                    let defaultNote = sys.id.includes('An ninh') ? '- Báo trạng thái cửa ra vào tầng Trệt và cửa ra vào sân thượng' : (sys.id.includes('Điều hòa') ? '- Điều khiển toàn bộ dàn lạnh trong nhà.' : '');
                                    return (
                                        <React.Fragment key={sys.id}>
                                            <tr className="font-bold">
                                                <td className="border border-black p-1 text-center">{smartHomeRowIdx++}</td>
                                                <td className="border border-black p-1 uppercase">{sys.name}</td>
                                                <td className="border border-black p-1 text-right pr-2">{formatMoney(sysTotal)}</td>
                                            </tr>
                                            <tr>
                                                <td className="border border-black p-1 border-t-0 border-r-0"></td>
                                                <td className="border border-black p-1 text-[12px] italic text-gray-700 leading-tight border-t-0 border-l-0" colSpan={2}>
                                                    <EditableInput value={sys.note || defaultNote} onChange={() => { }} placeholder="Ghi chú hệ thống chung..." isTextArea={true} isEditing={!isPreview} />
                                                </td>
                                            </tr>
                                        </React.Fragment>
                                    );
                                })}

                                <tr className="font-bold">
                                    <td className="border border-black p-1 text-center">{smartHomeRowIdx++}</td>
                                    <td className="border border-black p-1 uppercase">CHI PHÍ TRIỂN KHAI GIÁM SÁT, LẮP ĐẶT</td>
                                    <td className="border border-black p-1 text-right pr-2">{formatMoney(implementationCosts.install)}</td>
                                </tr>
                                <tr>
                                    <td className="border border-black p-1 border-t-0 border-r-0"></td>
                                    <td className="border border-black p-1 text-[12px] border-t-0 border-l-0 text-gray-700 leading-tight" colSpan={2}>
                                        <EditableInput value={"- Triển khai bản vẽ nguyên lý điện thông minh, cập nhật bản vẽ và hướng dẫn thi công định kì\n- Đấu nối tủ điện, lắp đặt các thiết bị điều khiển.\n- Đấu nối công tắc, cảm biến.\n- Kết nối điều hòa.\n- Chạy thử, hiệu chỉnh, thay đổi, bàn giao, bảo hành."} onChange={() => { }} isTextArea={true} isEditing={!isPreview} />
                                    </td>
                                </tr>

                                <tr className="font-bold">
                                    <td className="border border-black p-1 text-center">{smartHomeRowIdx++}</td>
                                    <td className="border border-black p-1 uppercase">CHI PHÍ THIẾT KẾ, LẬP TRÌNH, SETUP HỆ THỐNG</td>
                                    <td className="border border-black p-1 text-right pr-2">{formatMoney(implementationCosts.design)}</td>
                                </tr>
                                <tr>
                                    <td className="border border-black p-1 border-t-0 border-r-0"></td>
                                    <td className="border border-black p-1 text-[12px] border-t-0 border-l-0 text-gray-700 leading-tight" colSpan={2}>
                                        <EditableInput value={"- Lập trình hệ thống Smart home. Điều khiển toàn bộ các hạng mục: chiếu sáng, rèm, điều hòa, an ninh, cổng....\n- Lập trình, thiết kế giao diện trên Smart phone\n- Lập trình, thiết kế giao diện trên màn hình cảm ứng"} onChange={() => { }} isTextArea={true} isEditing={!isPreview} />
                                    </td>
                                </tr>

                                <tr className="bg-[#e2efda] font-bold">
                                    <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>TỔNG GIÁ TRỊ SMARTHOME</td>
                                    <td className="border border-black p-1.5 text-right pr-2">{formatMoney(grandTotal)}</td>
                                </tr>
                                <tr className="bg-[#e2efda] font-bold">
                                    <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>THUẾ VAT 8%</td>
                                    <td className="border border-black p-1.5 text-right pr-2">{formatMoney(grandTotal * 0.08)}</td>
                                </tr>
                                <tr className="bg-[#e2efda] font-bold border-b border-black">
                                    <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>TỔNG GIÁ TRỊ SMARTHOME SAU THUẾ</td>
                                    <td className="border border-black p-1.5 text-right pr-2">{formatMoney(grandTotal * 1.08)}</td>
                                </tr>
                            </tbody>
                        </table>

                        {includeAudio && (
                            <div className="mt-4">
                                <div className="text-red-600 font-bold text-sm uppercase mb-1">HẠNG MỤC NÂNG CAO:<br />OPTION (ÂM THANH ĐA VÙNG)</div>
                                <table className="w-full border-collapse border border-black mb-4 text-[13px] table-fixed">
                                    <tbody>
                                        {audioData.map((item, idx) => {
                                            let itemTotal = (parseFloat(item.qty) || 0) * (parseFloat(item.price) || 0);
                                            audioTotal += itemTotal;
                                            return (
                                                <React.Fragment key={item.id}>
                                                    <tr>
                                                        <td className="border border-black p-1 text-center w-12 text-red-600 font-bold">{idx + 1}</td>
                                                        <td className="border border-black p-1 font-bold">
                                                            <EditableInput value={item.name} onChange={v => { const newD = [...audioData]; newD[idx].name = v; setAudioData(newD); }} isEditing={!isPreview} />
                                                        </td>
                                                        <td className="border border-black p-1 text-right pr-2 w-32 font-bold">
                                                            {formatMoney(itemTotal)}
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td className="border border-black p-1 border-t-0 border-r-0"></td>
                                                        <td className="border border-black p-1 text-[12px] leading-tight border-t-0 border-l-0 text-gray-700" colSpan={2}>
                                                            <EditableInput value={item.desc} onChange={v => { const newD = [...audioData]; newD[idx].desc = v; setAudioData(newD); }} isTextArea={true} isEditing={!isPreview} />
                                                        </td>
                                                    </tr>
                                                </React.Fragment>
                                            )
                                        })}
                                        <tr className="bg-[#e2efda] font-bold">
                                            <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>TỔNG GIÁ TRỊ PHẦN ÂM THANH</td>
                                            <td className="border border-black p-1.5 text-right pr-2">{formatMoney(audioTotal)}</td>
                                        </tr>
                                        <tr className="bg-[#e2efda] font-bold">
                                            <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>THUẾ VAT 8%</td>
                                            <td className="border border-black p-1.5 text-right pr-2">{formatMoney(audioTotal * 0.08)}</td>
                                        </tr>
                                        <tr className="bg-[#e2efda] font-bold border-b border-black">
                                            <td className="border border-black p-1.5 text-center tracking-wide" colSpan={2}>TỔNG GIÁ TRỊ ÂM THANH SAU THUẾ</td>
                                            <td className="border border-black p-1.5 text-right pr-2">{formatMoney(audioTotal * 1.08)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        )}

                        <div className="mt-4 text-[13px]">
                            <h3 className="font-bold text-red-600 underline mb-2 uppercase">Điều kiện thương mại và phạm vi cung cấp:</h3>
                            <p className="font-bold underline mb-1">Giá đã bao gồm thuế VAT</p>
                            <table className="w-full mb-2">
                                <tbody>
                                    {commercialTerms.slice(0, 4).map((term, idx) => (
                                        <tr key={idx}>
                                            <td className="w-40 py-0.5 align-top font-semibold">{term.label}</td>
                                            <td className="py-0.5">
                                                <EditableInput value={term.value} onChange={(v) => {
                                                    const newTerms = [...commercialTerms]; newTerms[idx].value = v; setCommercialTerms(newTerms);
                                                }} isTextArea={true} isEditing={!isPreview} />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            <p className="font-bold underline mt-2 mb-1">Phạm vi cung cấp:</p>
                            <div className="pl-4">
                                <EditableInput value={commercialTerms[4].value} onChange={(v) => {
                                    const newTerms = [...commercialTerms]; newTerms[4].value = v; setCommercialTerms(newTerms);
                                }} isTextArea={true} isEditing={!isPreview} />
                            </div>

                            <p className="font-bold underline mt-2 mb-1">Phạm vi không cung cấp (chưa bao gồm):</p>
                            <div className="pl-4">
                                <EditableInput value={commercialTerms[5].value} onChange={(v) => {
                                    const newTerms = [...commercialTerms]; newTerms[5].value = v; setCommercialTerms(newTerms);
                                }} isTextArea={true} isEditing={!isPreview} />
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen bg-gray-100 font-sans ${isPreview ? 'bg-[#525659] pt-[70px] pb-[40px]' : 'p-4'}`}>
                    
                    {/* Toolbar */}
                    <div className={`fixed top-0 left-0 w-full z-[100] bg-gray-900 text-white p-2 flex justify-between items-center shadow-xl transition-all duration-300 ${isPreview ? 'print:hidden' : 'hidden'}`}>
                        <div className="w-full flex justify-between items-center px-4">
                            <div className="flex gap-4 items-center">
                                <span className="font-bold text-yellow-400 uppercase tracking-widest text-sm">XEM TRƯỚC BẢN IN</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-gray-400 text-[11px] uppercase font-bold mr-1">Khổ giấy:</span>
                                <button onClick={() => setPrintOrientation('portrait')} className={`px-3 py-1.5 rounded font-bold text-xs transition-colors ${printOrientation === 'portrait' ? 'bg-gray-600 text-white' : 'bg-transparent border border-gray-600 text-gray-400 hover:bg-gray-700'}`}>Dọc</button>
                                <button onClick={() => setPrintOrientation('landscape')} className={`px-3 py-1.5 rounded font-bold text-xs transition-colors ${printOrientation === 'landscape' ? 'bg-gray-600 text-white' : 'bg-transparent border border-gray-600 text-gray-400 hover:bg-gray-700'}`}>Ngang</button>
                                <div className="w-px h-5 bg-gray-700 mx-2"></div>
                                <button onClick={() => window.print()} className="flex items-center px-4 py-1.5 bg-gray-700 hover:bg-gray-600 border border-gray-500 rounded font-bold text-sm transition-colors text-white shadow">
                                    <Printer size={14} className="mr-2" /> XUẤT PDF / IN
                                </button>
                                <button onClick={() => setIsPreview(false)} className="flex items-center px-4 py-1.5 bg-red-900/50 hover:bg-red-800 border border-red-800 rounded font-bold text-sm transition-colors text-white ml-2">
                                    <X size={14} className="mr-2" /> Trở lại
                                </button>
                            </div>
                        </div>
                    </div>

                    {!isPreview && (
                        <div className="preview-toolbar max-w-6xl mx-auto bg-gray-900 text-white p-2 flex justify-between items-center shadow-xl rounded-lg mb-4">
                            <div className="flex gap-1.5">
                                <button onClick={() => setActiveTab('bom')} className={`px-4 py-1.5 rounded text-sm font-bold transition-colors ${activeTab === 'bom' ? 'bg-blue-600' : 'bg-gray-800 hover:bg-gray-700'}`}>BOM Kỹ thuật</button>
                                <button onClick={() => setActiveTab('summary')} className={`px-4 py-1.5 rounded text-sm font-bold transition-colors ${activeTab === 'summary' ? 'bg-blue-600' : 'bg-gray-800 hover:bg-gray-700'}`}>Bảng Tổng Hợp</button>
                                <button onClick={() => setActiveTab('detailed')} className={`px-4 py-1.5 rounded text-sm font-bold transition-colors ${activeTab === 'detailed' ? 'bg-blue-600' : 'bg-gray-800 hover:bg-gray-700'}`}>Bảng Chi Tiết</button>
                            </div>
                            <div className="flex items-center gap-2">
                                <label className="flex items-center gap-1.5 cursor-pointer bg-gray-800 px-2 py-1 rounded hover:bg-gray-700 transition-colors">
                                    <input type="checkbox" checked={includeAudio} onChange={(e) => setIncludeAudio(e.target.checked)} className="h-3 w-3 text-blue-500 rounded" />
                                    <span className="text-[11px] font-semibold text-green-400">+ Âm thanh</span>
                                </label>
                                <div className="flex items-center gap-1 bg-gray-800 px-2 py-1 rounded transition-colors">
                                    <select value={currency} onChange={e => setCurrency(e.target.value)} className="bg-transparent border-none text-white focus:ring-0 cursor-pointer outline-none font-bold text-[11px]">
                                        <option value="USD" className="text-black">USD</option>
                                        <option value="VND" className="text-black">VNĐ</option>
                                    </select>
                                    {currency === 'VND' && (
                                        <input type="number" value={exchangeRate} onChange={e => setExchangeRate(Number(e.target.value))} className="w-16 bg-gray-700 text-white px-1 py-0.5 rounded text-[11px] text-center border-none focus:ring-1 focus:ring-blue-500 outline-none" placeholder="Tỷ giá" />
                                    )}
                                </div>
                                <div className="h-4 w-px bg-gray-700 mx-1"></div>
                                <button onClick={handleExportData} className="flex items-center px-2 py-1 bg-indigo-900/50 hover:bg-indigo-800 border border-indigo-800 rounded text-[11px] font-bold transition-colors">
                                    <Download size={12} className="mr-1" /> LƯU FILE
                                </button>
                                <label className="flex items-center px-2 py-1 bg-orange-900/50 hover:bg-orange-800 border border-orange-800 rounded text-[11px] font-bold cursor-pointer transition-colors">
                                    <Upload size={12} className="mr-1" /> MỞ FILE
                                    <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                </label>
                                <button onClick={() => setIsPreview(true)} className="flex items-center px-3 py-1 bg-gray-200 text-gray-900 hover:bg-white rounded font-bold text-[12px] transition-colors ml-1 shadow">
                                    <Printer size={12} className="mr-1.5" /> Xem trước & In
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Vùng Giấy (Container) */}
                    <div className={`preview-container mx-auto transition-all duration-300 bg-white ${isPreview ? 'is-preview-mode' : 'max-w-6xl rounded-lg shadow-lg p-4 sm:p-6 mb-10'}`}>
                        
                        {(activeTab !== 'bom' || isPreview) && (
                            <>
                                <div className="flex justify-between items-start mb-2 pb-1">
                                    <div className="w-40 h-10">
                                        <ImageUpload value={headerInfo.logo} onChange={(v) => setHeaderInfo({ ...headerInfo, logo: v })} isEditing={!isPreview} />
                                    </div>
                                    <div className="text-right text-[11px] leading-snug">
                                        <div className="font-bold text-[#233f8d] text-[12px] uppercase">
                                            <EditableInput value="ASEL VIỆT NAM" onChange={() => { }} isEditing={!isPreview} />
                                        </div>
                                        <div className="font-bold text-gray-800"><EditableInput value="BMS & SMART HOME CENTER" onChange={() => { }} isEditing={!isPreview} /></div>
                                        <div className="text-gray-600"><EditableInput value="VPGD: Villa số 3, P. Thành Công, Q. Ba Đình, TP. Hà Nội" onChange={() => { }} isEditing={!isPreview} /></div>
                                        <div className="text-gray-600"><EditableInput value="Website: asel.vn" onChange={() => { }} isEditing={!isPreview} /></div>
                                    </div>
                                </div>

                                <div className="flex justify-between text-[12px] mb-3">
                                    <div className="w-1/2 pr-4">
                                        <div className="flex mb-0.5"><strong className="w-20">Dự án:</strong> <EditableInput value={headerInfo.projectName} onChange={(v) => setHeaderInfo({ ...headerInfo, projectName: v })} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-20">Quy mô:</strong> <EditableInput value="Biệt thự gia đình" onChange={() => { }} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-20">Địa chỉ:</strong> <EditableInput value={headerInfo.location} onChange={(v) => setHeaderInfo({ ...headerInfo, location: v })} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-20">Phương án:</strong> <EditableInput value={headerInfo.plan} onChange={(v) => setHeaderInfo({ ...headerInfo, plan: v })} isEditing={!isPreview} /></div>
                                    </div>
                                    <div className="w-1/2 pl-4">
                                        <div className="flex mb-0.5"><strong className="w-24">Tư vấn dự án:</strong> <EditableInput value={headerInfo.consultant} onChange={(v) => setHeaderInfo({ ...headerInfo, consultant: v })} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-24">Số điện thoại:</strong> <EditableInput value={headerInfo.phone} onChange={(v) => setHeaderInfo({ ...headerInfo, phone: v })} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-24">Email:</strong> <EditableInput value={headerInfo.email} onChange={(v) => setHeaderInfo({ ...headerInfo, email: v })} isEditing={!isPreview} /></div>
                                        <div className="flex mb-0.5"><strong className="w-24">Ngày báo giá:</strong> <EditableInput value={headerInfo.date} onChange={(v) => setHeaderInfo({ ...headerInfo, date: v })} isEditing={!isPreview} /></div>
                                    </div>
                                </div>
                                <div className="font-bold mb-3 text-[#233f8d] text-[12px] text-center italic">
                                    <EditableInput value={headerInfo.introText.split(' xin trân trọng')[0]} onChange={(v) => setHeaderInfo({ ...headerInfo, introText: v + ' xin trân trọng gửi tới Quý khách hàng dự toán chi tiết giải pháp như sau:' })} isEditing={!isPreview} />
                                </div>
                            </>
                        )}

                        {activeTab === 'bom' && renderBOM()}
                        {activeTab === 'detailed' && renderDetailedTable()}
                        {activeTab === 'summary' && renderSummaryTable()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
