        const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const ImageIcon = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Icon>;

        const EditableInput = ({ value, onChange, placeholder = "", className = "", isTextArea = false, isEditing = true }) => {
            if (!isEditing) {
                if (!value && value !== 0) return null;
                return <div className={`whitespace-pre-wrap break-words min-w-0 ${className}`}>{value}</div>;
            }
            return isTextArea ? (
                <textarea
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 resize-none outline-none break-words min-w-0 ${className}`}
                    rows={1}
                    onInput={(e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                />
            ) : (
                <input
                    type="text"
                    value={value || ''}
                    onChange={e => onChange(e.target.value)}
                    placeholder={placeholder}
                    className={`w-full bg-transparent border-none focus:ring-1 focus:ring-blue-500 outline-none break-words min-w-0 ${className}`}
                />
            );
        };

        const ImageUpload = ({ value, onChange, isEditing = true }) => {
            const fileInputRef = useRef(null);
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => onChange(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center w-full h-full min-h-[80px]">
                    {value ? (
                        <div className="relative group w-full h-full flex items-center justify-center">
                            <img src={value} alt="Uploaded" className="max-w-full max-h-[100px] object-contain cursor-pointer" onClick={() => isEditing && fileInputRef.current?.click()} />
                            {isEditing && (
                                <button onClick={() => onChange('')} className="absolute top-0 right-0 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity hide-on-print" title="Xóa ảnh">
                                    <X size={12} />
                                </button>
                            )}
                        </div>
                    ) : (
                        isEditing && (
                            <div onClick={() => fileInputRef.current?.click()} className="cursor-pointer flex flex-col items-center justify-center text-gray-400 hover:text-blue-500 hide-on-print border-2 border-dashed border-gray-300 rounded p-2 w-full h-full">
                                <ImageIcon size={24} />
                                <span className="text-xs mt-1 text-center">Tải ảnh</span>
                            </div>
                        )
                    )}
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileChange} className="hidden" />
                </div>
            );

                    { id: 't2', category: 'VI', categoryName: 'Tủ điện', name: 'Bộ cấp nguồn hệ thống 24V', desc: 'Công suất 60W Cresnet.\nNguồn vào 100-277V AC.', brand: 'CRESTRON - USA/MEXICO', unit: 'Bộ', price: 400, quantities: { tret: 3, t1: 0, t2: 0 } },

                    { id: 't5', category: 'VI', categoryName: 'Tủ điện', name: 'Bộ mở rộng Lutron', desc: 'Bộ mở rộng tín hiệu không dây cho các thiết bị Lutron.', brand: 'LUTRON - USA/PRC', unit: 'Bộ', price: 400, quantities: { tret: 3, t1: 0, t2: 0 } },

                const dataToSave = { headerInfo, bomMap, audioData, commercialTerms, includeAudio, exchangeRate, currency };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });

            const handleImportData = (e) => {
                const file = e.target.files[0];

                const reader = new FileReader();

                    try {
                        const parsed = JSON.parse(event.target.result);

                        if (parsed.audioData) setAudioData(parsed.audioData);
                        if (parsed.commercialTerms) setCommercialTerms(parsed.commercialTerms);
                        if (parsed.includeAudio !== undefined) setIncludeAudio(parsed.includeAudio);
                        if (parsed.exchangeRate) setExchangeRate(parsed.exchangeRate);
                        if (parsed.currency) setCurrency(parsed.currency);
                    } catch (err) { alert("File không hợp lệ hoặc bị lỗi!"); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const hardwareTotal = useMemo(() => {
                return bomMap.items.reduce((sum, item) => {
                    if (item.isImplementationCost) return sum;
                    const totalQty = bomMap.floors.reduce((qSum, f) => qSum + (parseFloat(item.quantities[f.id]) || 0), 0);
                    return sum + (totalQty * (parseFloat(item.price) || 0));
                }, 0);
            }, [bomMap]);

            const implementationCosts = useMemo(() => {
                return { design: hardwareTotal * 0.12, install: hardwareTotal * 0.13 };
            }, [hardwareTotal]);

            const ioCalculations = useMemo(() => {
                const calc = { floors: {}, total: { input: 0, dinNeed: 0, dinReported: 0, missing: 0 } };
                bomMap.floors.forEach(f => { calc.floors[f.id] = { input: 0, dinReported: 0, dinNeed: 0, missing: 0 }; });

                bomMap.items.forEach(item => {
                    const isInputDevice = item.isInput;
                    const isMechanical = item.isMechanical;
                    const buttons = item.buttons || 1;
                    const isDinController = item.isDinController;

                    bomMap.floors.forEach(f => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (isInputDevice) {
                            calc.floors[f.id].input += qty;
                            calc.total.input += qty;
                        } else if (isMechanical) {
                            const inputs = qty * buttons;
                            calc.floors[f.id].input += inputs;
                            calc.total.input += inputs;
                        }
                        if (isDinController) {
                            calc.floors[f.id].dinReported += qty;
                            calc.total.dinReported += qty;
                        }
                    });
                });

                bomMap.floors.forEach(f => {
                    calc.floors[f.id].dinNeed = Math.ceil(calc.floors[f.id].input / 8);
                    const diff = calc.floors[f.id].dinNeed - calc.floors[f.id].dinReported;
                    calc.floors[f.id].missing = diff > 0 ? diff : 0;
                });
                calc.total.dinNeed = Math.ceil(calc.total.input / 8);
                const totalDiff = calc.total.dinNeed - calc.total.dinReported;
                calc.total.missing = totalDiff > 0 ? totalDiff : 0;

                return calc;
            }, [bomMap]);

            const detailedData = useMemo(() => {
                let floorsData = [];
                bomMap.floors.forEach(f => {
                    let systemsMap = {};
                    bomMap.items.forEach(item => {
                        const qty = parseFloat(item.quantities[f.id]) || 0;
                        if (qty > 0 && !item.isMechanical && !item.isImplementationCost) {
                            const isCommonSystem = ['IV', 'V', 'VI', 'VII', 'VIII'].includes(item.category);
                            if (!isCommonSystem) {
                                const sysName = `${item.categoryName}`;
                                if (!systemsMap[sysName]) systemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                                systemsMap[sysName].items.push({ ...item, qty, total: qty * item.price });
                            }
                        }
                    });
                    if (Object.keys(systemsMap).length > 0) floorsData.push({ id: f.id, name: f.name, systems: Object.values(systemsMap) });
                });

                let commonSystemsMap = {};
                bomMap.items.forEach(item => {
                    const isCommonSystem = ['IV', 'V', 'VI', 'VII', 'VIII'].includes(item.category);
                    if (isCommonSystem && !item.isMechanical && !item.isImplementationCost) {
                        const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                        if (totalQty > 0) {
                            const sysName = `${item.categoryName}`;
                            if (!commonSystemsMap[sysName]) commonSystemsMap[sysName] = { id: sysName, name: sysName, items: [] };
                            commonSystemsMap[sysName].items.push({ ...item, qty: totalQty, total: totalQty * item.price });
                        }
                    }
                });
                if (Object.keys(commonSystemsMap).length > 0) floorsData.push({ id: 'common', name: 'HỆ THỐNG CHUNG', systems: Object.values(commonSystemsMap) });

                return floorsData;
            }, [bomMap]);

            const updateBOMQuantity = (floorId, itemId, newQtyStr) => {
                const qty = parseFloat(newQtyStr);
                const finalQty = isNaN(qty) ? '' : qty;
                setBomMap(prev => ({
                    ...prev,
                    items: prev.items.map(item => item.id === itemId ? { ...item, quantities: { ...item.quantities, [floorId]: finalQty } } : item)
                }));
            };

            const addFloor = () => {
                const newId = `t${bomMap.floors.length + 1}`;
                setBomMap(prev => {
                    let newFloors = [...prev.floors];

                    return { ...prev, floors: newFloors };
                });

            const removeFloor = (floorId) => {
                setBomMap(prev => ({ ...prev, floors: prev.floors.filter(f => f.id !== floorId) }));
            };

            const deleteItemFromDetail = (floorId, itemId) => { 
                updateBOMQuantity(floorId, itemId, 0);

            const renderBOM = () => {
                const groupedItems = bomMap.items.reduce((acc, item) => {

                    <div className="w-full">

                            <table className="w-full border-collapse border border-black min-w-[800px] text-sm">
                                <thead>

                                        <td className="border border-black p-2 min-w-[200px] text-center">Hạng mục</td>
                                        <td className="border border-black p-2 text-center w-20">Đơn vị</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center w-16 group relative">
                                                <EditableInput value={f.name} onChange={(v) => {
                                                    setBomMap({ ...bomMap, floors: bomMap.floors.map(fl => fl.id === f.id ? { ...fl, name: v } : fl) });
                                                }} className="text-center font-bold" isEditing={!isPreview} />

                                                    <button onClick={() => removeFloor(f.id)} className="absolute -top-2 -right-2 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded-full border shadow hide-on-print">
                                                        <X size={16} />
                                                    </button>
                                                )}

                                        ))}

                                        <td className="border border-black p-2 text-center w-24">Đơn giá</td>
                                        <td className="border border-black p-2 text-center w-28">Thành tiền</td>
                                    </tr>
                                </thead>
                                <tbody>
                                    {Object.keys(groupedItems).map((catKey) => (
                                        <React.Fragment key={catKey}>

                                                <td className="border border-black p-2 uppercase" colSpan={bomMap.floors.length + 4}>{groupedItems[catKey].categoryName}</td>
                                            </tr>
                                            {groupedItems[catKey].items.map((item, idx) => {
                                                const totalQty = bomMap.floors.reduce((sum, f) => sum + (parseFloat(item.quantities[f.id]) || 0), 0);
                                                let displayPrice = item.price;
                                                let displayTotal = totalQty * item.price;

                                                    displayTotal = displayPrice;

                                                        <td className="border border-black p-2">
                                                            <EditableInput value={item.name} onChange={(v) => {

                                                            }} isEditing={!isPreview} />

                                                                <td className="border border-black p-2 text-center font-bold">{totalQty > 0 ? totalQty : ''}</td>

                                                            {item.isImplementationCost ? '-' : (

                                                                    <div className="text-center">{formatMoney(item.price)}</div>

                                                                    <EditableInput value={item.price} onChange={(v) => {
                                                                        setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, price: v } : i) });
                                                                    }} className="text-center" isEditing={true} />
                                                                )
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-2 text-right">{formatMoney(displayTotal)}</td>
                                                    </tr>
                                                );
                                            })}
                                        </React.Fragment>
                                    ))}

                                    {/* Bảng Tính Toán IO */}
                                    <tr className="bg-[#e2efda] font-bold mt-4">
                                        <td className="border border-black p-2 text-center">IX</td>
                                        <td className="border border-black p-2 uppercase" colSpan={bomMap.floors.length + 4}>TÍNH TOÁN ĐẦU VÀO IO</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center font-bold">1</td>
                                        <td className="border border-black p-2">Tổng số đầu vào Input</td>
                                        <td className="border border-black p-2 text-center">-</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center font-bold bg-orange-50">{ioCalculations.floors[f.id].input || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold bg-orange-50">{ioCalculations.total.input || ''}</td>
                                        <td colSpan={2} className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center font-bold">2</td>
                                        <td className="border border-black p-2">Số bộ DIN8s-8i CẦN</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center">{ioCalculations.floors[f.id].dinNeed || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold">{ioCalculations.total.dinNeed || ''}</td>
                                        <td colSpan={2} className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>

                                        <td className="border border-black p-2">Tổng số bộ Din đã báo</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => (
                                            <td key={f.id} className="border border-black p-2 text-center bg-blue-100">{ioCalculations.floors[f.id].dinReported || ''}</td>
                                        ))}
                                        <td className="border border-black p-2 text-center font-bold bg-blue-100">{ioCalculations.total.dinReported || ''}</td>
                                        <td colSpan={2} className="border border-black p-2 text-center">-</td>
                                    </tr>
                                    <tr>
                                        <td className="border border-black p-2 text-center font-bold">4</td>
                                        <td className="border border-black p-2 font-bold">Số lượng CẦN BỔ SUNG</td>
                                        <td className="border border-black p-2 text-center">Bộ</td>
                                        {bomMap.floors.map(f => {
                                            const m = ioCalculations.floors[f.id].missing;
                                            return <td key={f.id} className={`border border-black p-2 text-center font-bold bg-orange-100 ${m > 0 ? 'text-red-600' : ''}`}>{m > 0 ? m : '-'}</td>
                                        })}
                                        <td className={`border border-black p-2 text-center font-bold bg-orange-100 ${ioCalculations.total.missing > 0 ? 'text-red-600' : ''}`}>{ioCalculations.total.missing > 0 ? ioCalculations.total.missing : '-'}</td>
                                        <td colSpan={2} className="border border-black p-2 text-center">-</td>
                                    </tr>
                                </tbody>
                            </table>
                            {!isPreview && (
                                <div className="mt-4 hide-on-print">
                                    <button onClick={addFloor} className="flex items-center px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow">
                                        <Plus size={16} className="mr-2" /> THÊM TẦNG MỚI
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderDetailedTable = () => {
                return (
                    <div className="w-full">
                        <table className="w-full border-collapse border border-black mb-6 text-sm table-fixed">
                            <thead>
                                <tr className="bg-[#fff2cc] font-bold text-center">
                                    <td className="border border-black p-2 w-12">STT</td>
                                    <td className="border border-black p-2 w-32">Hình ảnh</td>
                                    <td className="border border-black p-2">Hạng mục / Mô tả / Hãng / Xuất xứ</td>
                                    <td className="border border-black p-2 w-16">Đơn vị</td>
                                    <td className="border border-black p-2 w-16">SL</td>
                                    <td className="border border-black p-2 w-24">Đơn giá</td>
                                    <td className="border border-black p-2 w-28">Thành tiền</td>
                                </tr>
                            </thead>
                            <tbody>
                                {detailedData.map((floor) => (
                                    <React.Fragment key={floor.id}>
                                        <tr className="bg-[#e2efda] font-bold text-lg">
                                            <td colSpan={7} className="border border-black p-2 uppercase">
                                                <EditableInput value={floor.name} onChange={() => { }} isEditing={false} />
                                            </td>
                                        </tr>
                                        {floor.systems.map((system, sysIndex) => (
                                            <React.Fragment key={system.id}>
                                                <tr className="font-bold">
                                                    <td className="border border-black p-2 text-center text-lg">{sysIndex + 1}</td>
                                                    <td colSpan={6} className="border border-black p-2 text-lg uppercase bg-orange-50">{system.name}</td>
                                                </tr>
                                                {system.items.map((item, itemIdx) => (
                                                    <tr key={item.id} className="group hover:bg-gray-50">
                                                        <td className="border border-black p-2 text-center align-top relative font-bold">
                                                            {sysIndex + 1}.{itemIdx + 1}
                                                            {!isPreview && (
                                                                <button onClick={() => deleteItemFromDetail(floor.id, item.id)} className="absolute top-2 left-1 text-red-500 opacity-0 group-hover:opacity-100 bg-white rounded hide-on-print shadow border">
                                                                    <Trash2 size={14} />
                                                                </button>
                                                            )}
                                                        </td>
                                                        <td className="border border-black p-2 align-top">
                                                            <ImageUpload value={item.image} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, image: v } : i) });
                                                            }} isEditing={!isPreview} />
                                                        </td>
                                                        <td className="border border-black p-2 align-top break-words min-w-0">
                                                            <div className="font-bold mb-1">
                                                                <EditableInput value={item.name} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, name: v } : i) });
                                                                }} isEditing={!isPreview} />
                                                            </div>
                                                            <EditableInput value={item.desc} onChange={(v) => {
                                                                setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, desc: v } : i) });
                                                            }} placeholder="Mô tả kỹ thuật..." className="text-sm text-gray-600 italic" isTextArea={true} isEditing={!isPreview} />
                                                            <div className="mt-2 text-sm text-gray-600 font-semibold">
                                                                <EditableInput value={item.brand} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, brand: v } : i) });
                                                                }} placeholder="Hãng / Xuất xứ" isEditing={!isPreview} />
                                                            </div>
                                                        </td>
                                                        <td className="border border-black p-2 text-center align-top">{item.unit}</td>
                                                        <td className="border border-black p-2 text-center align-top">
                                                            {floor.id === 'common' ? item.qty : (
                                                                <EditableInput value={item.qty} onChange={(v) => updateBOMQuantity(floor.id, item.id, v)} className="text-center" isEditing={!isPreview} />

                                                        </td>
                                                        <td className="border border-black p-2 text-center align-top">
                                                            {isPreview ? (
                                                                <div className="text-center">{formatMoney(item.price)}</div>
                                                            ) : (
                                                                <EditableInput value={item.price} onChange={(v) => {
                                                                    setBomMap({ ...bomMap, items: bomMap.items.map(i => i.id === item.id ? { ...i, price: v } : i) });

                                                            {formatMoney(item.total)}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        ))}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>

                        {includeAudio && (
                            <div className="mt-8 page-break-before">
                                <div className="text-red-600 font-bold text-lg uppercase mb-2">HẠNG MỤC NÂNG CAO:<br />OPTION (ÂM THANH ĐA VÙNG)</div>
                                <table className="w-full border-collapse border border-black mb-6 text-sm table-fixed">
                                    <thead>
                                        <tr className="bg-[#fff2cc] font-bold text-center">
                                            <td className="border border-black p-2 w-12">STT</td>
                                            <td className="border border-black p-2 w-32">Hình ảnh</td>
                                            <td className="border border-black p-2">Mô tả / Hãng / Xuất xứ</td>
                                            <td className="border border-black p-2 w-16">Đơn vị</td>
                                            <td className="border border-black p-2 w-16">SL</td>

                                            <td className="border border-black p-2 w-28">Thành tiền</td>

                                        {audioData.map((item, idx) => (

    <style>
        @media print {
            /* Máy in sẽ đọc khối lệnh css này để tự động thiết lập khổ giấy và ẩn các nút không cần thiết */
            @page {

                /* Biến CSS từ React sẽ quyết định đây là khổ ngang hay dọc */
                size: var(--print-orientation, A4 landscape);

            /* Tẩy trắng toàn bộ phông nền và khung viền khi in để A4 sạch sẽ */

                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            
            /* Loại bỏ viền của textarea và input khi xuất PDF */
            textarea, input, select {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                overflow: hidden !important;
                appearance: none;
                -webkit-appearance: none;
            }
            textarea::placeholder, input::placeholder {
                color: transparent !important;
            }
            .page-break-before {
                page-break-before: always;
            }
        }
        
        /* Cấu hình mô phỏng giấy A4 hiển thị trên màn hình xem trước (WYSIWYG) */
        .preview-container {
            transition: all 0.3s ease;

        /* Mặc định trên trình duyệt khi bật Preview (Không phải lúc in thật) */

            width: var(--preview-width, 297mm) !important;
            max-width: var(--preview-width, 297mm) !important;
            min-height: var(--preview-height, 210mm) !important;
            margin-left: auto !important;
            margin-right: auto !important;
            background: white !important;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4) !important;
        }
    </style>
    
    <!-- Script đồng bộ hướng giấy từ React ra thẻ HTML để CSS đọc được -->
    <script>
        // Liên tục kiểm tra thuộc tính orientation từ React để update biến CSS
        setInterval(() => {
            const isPortrait = document.querySelector('button.bg-blue-600') && document.querySelector('button.bg-blue-600').innerText.includes('In Dọc');
            const orientation = isPortrait ? 'portrait' : 'landscape';
            document.documentElement.style.setProperty('--print-orientation', 'A4 ' + orientation);
            document.documentElement.style.setProperty('--preview-width', orientation === 'landscape' ? '297mm' : '210mm');
            document.documentElement.style.setProperty('--preview-height', orientation === 'landscape' ? '210mm' : '297mm');
        }, 300);
    </script>
